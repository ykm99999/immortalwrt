name: SL3000-Asset-Generator

on:
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Execute Factory Script
        run: |
          chmod +x ./scripts/factory-init.sh
          ./scripts/factory-init.sh
        shell: bash

      - name: 3. Path & File Verification
        run: |
          echo ">>> 正在根目录搜索资产..."
          if [ -f "mt7981b-sl3000-emmc.dts" ] && [ -f "filogic.mk" ] && [ -f "sl3000.config" ]; then
            echo "✅ 资产已定位在根目录。"
          else
            echo "❌ 资产生成失败，正在尝试全盘深度搜索..."
            find . -name "*.dts" -o -name "*.mk" -o -name "*.config"
            exit 1
          fi

      - name: 4. Upload Assets
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Clean-Assets
          path: |
            mt7981b-sl3000-emmc.dts
            filogic.mk
            sl3000.config
