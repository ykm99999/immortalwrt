name: SL3000-Asset-Generator

on:
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 运行工厂生成脚本
        run: |
          chmod +x ./scripts/factory-init.sh
          ./scripts/factory-init.sh

      - name: 3. 基础逻辑验证 (非严格校验)
        run: |
          echo ">>> 正在检查文件是否存在..."
          ls -lh mt7981b-sl3000-emmc.dts filogic.mk sl3000.config
          
          echo ">>> 验证文件内容完整性..."
          # 检查是否有关键的根节点和大括号闭合
          grep -q "model = \"SL-3000 eMMC Router\"" mt7981b-sl3000-emmc.dts
          grep -q "TARGET_DEVICES += sl3000-emmc" filogic.mk
          
          echo ">>> 排除 #include 进行纯语法结构预演..."
          sudo apt-get install -y device-tree-compiler
          # 剔除所有 # 开头的行，生成临时文件进行语法检查
          grep -v "^#" mt7981b-sl3000-emmc.dts > syntax_test.dts
          dtc -I dts -O dtb -o /dev/null syntax_test.dts
          echo "✅ 核心结构校验通过（已跳过预处理指令）"

      - name: 4. 上传三件套
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Clean-Assets
          path: |
            mt7981b-sl3000-emmc.dts
            filogic.mk
            sl3000.config
