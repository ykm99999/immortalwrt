name: SL3000-Asset-Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Run Script
        run: |
          chmod +x ./scripts/factory-init.sh
          ./scripts/factory-init.sh
        shell: bash

      - name: 3. Verify
        run: |
          ls -l mt7981b-sl3000-emmc.dts filogic.mk sl3000.config

      - name: 4. Upload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Assets
          path: |
            mt7981b-sl3000-emmc.dts
            filogic.mk
            sl3000.config
