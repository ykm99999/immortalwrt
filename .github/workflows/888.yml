name: SL3000-Asset-Generator

on:
  workflow_dispatch: # 手动触发运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 赋予脚本执行权限
        run: chmod +x ./scripts/factory-init.sh

      - name: 3. 执行生成脚本
        run: ./scripts/factory-init.sh
        shell: bash

      - name: 4. 深度验证完整性 (核心修复步)
        run: |
          echo ">>> 正在执行物理校验..."
          
          # 检查文件是否存在
          files=("mt7981b-sl3000-emmc.dts" "filogic.mk" "sl3000.config")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ 错误: 关键文件 $f 未生成！"
              exit 1
            fi
          done

          # 检查 DTS 是否包含核心节点 (防止截断)
          if ! grep -q "model =" mt7981b-sl3000-emmc.dts; then
            echo "❌ 错误: DTS 内容不完整！"
            exit 1
          fi

          # 检查 Makefile 是否包含 GPT 逻辑
          if ! grep -q "mt798x-gpt" filogic.mk; then
            echo "❌ 错误: Makefile 逻辑缺失！"
            exit 1
          fi

          echo "✅ 所有文件校验通过，结构完整。"
          ls -lh *.dts *.mk *.config

      - name: 5. 自动上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Complete-Assets
          path: |
            mt7981b-sl3000-emmc.dts
            filogic.mk
            sl3000.config
          retention-days: 7
