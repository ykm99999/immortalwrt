name: Rebuild SL3000 Three-Piece (25.12)

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置执行权限（只需要两个脚本）
      - name: Make scripts executable
        run: |
          chmod +x sl3000-tools/generate-three-piece.sh
          chmod +x sl3000-tools/three-piece-check.sh

      # 3. 生成三件套（25.12 + 6.12）
      - name: Generate SL3000 Three-Piece
        run: |
          ./sl3000-tools/generate-three-piece.sh

      # 4. 校验三件套（可选但推荐）
      - name: Check SL3000 Three-Piece
        run: |
          ./sl3000-tools/three-piece-check.sh

      # 5. 上传三件套产物
      - name: Upload three-piece artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-three-piece-25.12
          path: |
            target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts
            target/linux/mediatek/image/filogic.mk
            .config

      # 6. 自动提交三件套更新
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts
          git add target/linux/mediatek/image/filogic.mk
          git add .config

          git commit -m "ci: auto rebuild SL3000 three-piece (25.12)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm99999/immortalwrt.git main
