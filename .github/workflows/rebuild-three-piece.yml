name: Rebuild SL3000 Three-Piece (25.12)

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置执行权限（sl3000-tools 目录）
      - name: Make scripts executable
        run: |
          chmod +x sl3000-tools/generate-three-piece.sh
          chmod +x sl3000-tools/three-piece-check.sh
          chmod +x sl3000-tools/three-piece-fix.sh
          chmod +x sl3000-tools/three-piece-rebuild.sh
          chmod +x sl3000-tools/profiles-check.sh

      # 3. 运行三件套重建脚本（无需 openwrt 源码）
      - name: Run three-piece rebuild
        run: |
          ./sl3000-tools/three-piece-rebuild.sh

      # 4. 上传三件套产物（保持 24.10 目录结构）
      - name: Upload three-piece artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-three-piece
          path: |
            target/linux/mediatek/dts/mt7981b-sl-3000-emmc.dts
            target/linux/mediatek/image/filogic.mk
            .config

      # 5. 提交三件套更新（仓库已修复为 ykm99999/immortalwrt）
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add target/linux/mediatek/dts/mt7981b-sl-3000-emmc.dts
          git add target/linux/mediatek/image/filogic.mk
          git add .config
          git commit -m "ci: auto rebuild SL3000 three-piece (25.12)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm99999/immortalwrt.git main
