name: SL3000-24.10-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. [彻底扩容] 磁盘清理与 12G Swap
        run: |
          # 彻底解决 No space left on device：删除虚拟机自带的 30GB+ 垃圾软件
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /etc/apt/sources.list.d/*
          # 保留之前的 12G Swap 修复
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h # 打印磁盘状态，确保空间充足

      - name: 3. 环境准备 (24.10)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            grep patch diffutils file findutils coreutils util-linux \
            gzip bzip2 unzip wget perl python3 python3-setuptools \
            libncurses5-dev libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler bc dos2unix rsync qemu-utils fakeroot
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. [物理注入] 延续成功案例配置
        run: |
          # 100% 物理覆盖，不给系统自作主张的机会
          mkdir -p ${{ env.WORKDIR }}/target/linux/mediatek/image
          cp -fv filogic.mk ${{ env.WORKDIR }}/target/linux/mediatek/image/filogic.mk
          cp -fv sl3000.config ${{ env.WORKDIR }}/.config

      - name: 5. [内核对齐] DTS 注入与 Makefile 注册
        run: |
          cd ${{ env.WORKDIR }}
          make target/linux/prepare -j$(nproc)
          # 定位内核 DTS 目录并注入
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv ../mt7981-sl3000-emmc.dts "$K_DTS_DIR/"
          # 在 Makefile 中注册，确保编译生成 dtb
          sed -i '/mt7981-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
          sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK)/a \dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981-sl3000-emmc.dtb' "$K_DTS_DIR/Makefile"
          # 锁定分区大小到配置文件
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          yes "" | make oldconfig

      - name: 6. [数字化产出] 全量编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 设置环境变量，使用多线程加速
          make -j$(nproc) || make -j1 V=s

      - name: 7. 发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-24.10-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000*
          token: ${{ secrets.GITHUB_TOKEN }}
