name: build-sl3000-openwrt-2512

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  WORK_DIR: ${{ github.workspace }}/openwrt_2512
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-25.12

jobs:
  build-sl3000-2512:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 0. Checkout repo
      # ============================================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      # ============================================================
      # 1. Prepare build directory
      # ============================================================
      - name: Prepare build directory
        run: |
          sudo rm -rf "${{ env.WORK_DIR }}"
          mkdir -p "${{ env.WORK_DIR }}"

      # ============================================================
      # 2. Clone ImmortalWrt 25.12
      # ============================================================
      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth=1 -b "${{ env.SOURCE_BRANCH }}" "${{ env.SOURCE_REPO }}" "${{ env.WORK_DIR }}"

      # ============================================================
      # 3. Install dependencies + ccache
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip \
            rsync unzip zlib1g-dev file ccache

          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-2512-${{ github.sha }}
          restore-keys: |
            ccache-2512-

      # ============================================================
      # 4. Update feeds (25.12 APK feeds)
      # ============================================================
      - name: Update feeds
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 5. Apply three-piece set (DTS/MK/CONFIG)
      # ============================================================
      - name: Apply three-piece set
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Applying DTS/MK/CONFIG..."
          cp -v "$GITHUB_WORKSPACE/repo/sl3000/dts/mt7981b-sl-3000-emmc.dts" target/linux/mediatek/dts/
          cp -v "$GITHUB_WORKSPACE/repo/sl3000/mk/filogic-sl3000.mk" target/linux/mediatek/image/
          cp -v "$GITHUB_WORKSPACE/repo/sl3000/config/sl3000.config" .config
          make defconfig

      # ============================================================
      # 6. Verify CONFIG loaded
      # ============================================================
      - name: Verify CONFIG loaded
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Checking CONFIG..."
          grep -q "CONFIG_TARGET_mediatek" .config \
            && echo "CONFIG 已加载" \
            || (echo "CONFIG 未加载"; exit 1)

      # ============================================================
      # 7. Build tools
      # ============================================================
      - name: Build tools
        working-directory: ${{ env.WORK_DIR }}
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s

      # ============================================================
      # 8. Build toolchain
      # ============================================================
      - name: Build toolchain
        working-directory: ${{ env.WORK_DIR }}
        run: |
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      # ============================================================
      # 9. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: ${{ env.WORK_DIR }}
        run: |
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      # ============================================================
      # 10. Verify DTS compiled
      # ============================================================
      - name: Verify DTS compiled
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Checking DTS..."
          find build_dir/ -name "*sl-3000*.dtb" -print -quit \
            || (echo "DTS 未被编译"; exit 1)

      # ============================================================
      # 11. Verify MK applied
      # ============================================================
      - name: Verify MK applied
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Checking MK..."
          grep -R "sl3000" -n target/linux/mediatek/image/ \
            || (echo "MK 未被加载"; exit 1)

      # ============================================================
      # 12. Build packages (APK mode)
      # ============================================================
      - name: Build packages
        working-directory: ${{ env.WORK_DIR }}
        run: |
          make package/compile -j"$(nproc)" || make package/compile -j1 V=s

      # ============================================================
      # 13. Build image (APK image builder)
      # ============================================================
      - name: Build image
        working-directory: ${{ env.WORK_DIR }}
        run: |
          make -j"$(nproc)" || make -j1 V=s

      # ============================================================
      # 14. Verify final firmware
      # ============================================================
      - name: Verify final firmware
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Checking final firmware..."
          find bin/targets/ -name "*sl3000*" -print -quit \
            || (echo "未生成 sl3000 固件"; exit 1)

      # ============================================================
      # 15. Upload firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-2512-firmware
          path: |
            ${{ env.WORK_DIR }}/bin/targets
