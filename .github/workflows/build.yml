name: SL3000-Brute-Force-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 环境准备
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison gawk m4 rsync unzip device-tree-compiler bc dos2unix

      - name: 2. 下载源码
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone https://github.com/${{ github.repository }}.git custom-repo

      - name: 3. 脚本注入
        working-directory: immortalwrt
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x ../custom-repo/scripts/clean-feeds.sh
          ../custom-repo/scripts/clean-feeds.sh

      - name: 4. 编译工具链
        working-directory: immortalwrt
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 5. 内核 Makefile 暴力劫持
        working-directory: immortalwrt
        run: |
          # 展开内核源码
          make target/linux/prepare -j$(nproc)
          
          # 找到真正的内核 DTS 目录
          KERNEL_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          
          # 【核心暴力步骤】将我们的独立版 DTS 拷贝进去
          cp -fv target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts "$KERNEL_DTS_DIR/"
          
          # 强行在内核 Makefile 里注册这个文件，不注册就不编译
          sed -i '/mt7981-rfb/a dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$KERNEL_DTS_DIR/Makefile"

      - name: 6. 路径对齐与总攻
        working-directory: immortalwrt
        run: |
          # 修复 root-mediatek 路径缺失问题
          BUILD_PARENT=$(find build_dir -name "target-aarch64_cortex-a53_musl" -type d | head -n 1)
          if [ -d "$BUILD_PARENT" ]; then
            REAL_ROOT=$(ls -d $BUILD_PARENT/root-* | head -n 1)
            [ -n "$REAL_ROOT" ] && ln -snf "$REAL_ROOT" "$BUILD_PARENT/root-mediatek"
          fi
          
          # 执行最终编译
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make -j$(nproc)

      - name: 7. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1GB-Firmware
          path: immortalwrt/bin/targets/mediatek/filogic/*.bin
