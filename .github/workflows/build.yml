name: SL3000-eMMC-FINAL-BUILD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /opt/google /opt/microsoft /usr/local/share/chromium
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-dev python3-distutils \
            rsync unzip git wget curl device-tree-compiler libelf-dev qemu-utils

      - name: Clone ImmortalWrt 24.10
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Cache dl packages
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}

      - name: Copy DTS and script
        run: |
          cp mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/
          cp sl3000-patch.sh openwrt/
          chmod +x openwrt/sl3000-patch.sh

      - name: Run patch script
        working-directory: openwrt
        run: |
          ./sl3000-patch.sh

      - name: Build tools & toolchain
        working-directory: openwrt
        run: |
          make tools/compile -j1 V=s
          make tools/install -j1 V=s
          make toolchain/compile -j1 V=s
          make toolchain/install -j1 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j1 V=s

      - name: Find firmware
        working-directory: openwrt
        run: |
          BIN=$(find bin/targets -name "*sl3000*sysupgrade.bin" | head -1)
          echo "FIRMWARE_PATH=$BIN" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-build-${{ github.run_id }}
          files: openwrt/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
