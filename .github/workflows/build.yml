name: SL3000 All-In-One Pipeline (25.12)

on:
  workflow_dispatch:

jobs:
  sl3000:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置执行权限（所有脚本）
      - name: Make scripts executable
        run: |
          chmod +x sl3000-tools/all-in-one.sh
          chmod +x sl3000-tools/generate-three-piece.sh
          chmod +x sl3000-tools/three-piece-check.sh
          chmod +x sl3000-tools/three-piece-fix.sh
          chmod +x sl3000-tools/three-piece-rebuild.sh
          chmod +x sl3000-tools/profiles-check.sh
          chmod +x sl3000-tools/compare-with-upstream-smart.sh

      # 3. 克隆官方 ImmortalWrt 25.12 源码（all-in-one full 模式需要）
      - name: Clone ImmortalWrt 25.12 source
        run: |
          rm -rf openwrt
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "✔ 已克隆 ImmortalWrt 25.12"

      # 4. 运行 all-in-one.sh（check 模式：不构建固件）
      - name: Run all-in-one check mode
        run: |
          ./sl3000-tools/all-in-one.sh check

      # 5. 运行 all-in-one.sh（full 模式：完整构建固件）
      - name: Run all-in-one full mode
        run: |
          ./sl3000-tools/all-in-one.sh full

      # 6. 上传三件套产物
      - name: Upload three-piece artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-three-piece
          path: |
            target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts
            target/linux/mediatek/image/filogic.mk
            .config

      # 7. 上传固件产物
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: openwrt/bin/targets/mediatek/filogic/

      # 8. 自动提交三件套更新
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts
          git add target/linux/mediatek/image/filogic.mk
          git add .config

          git commit -m "ci: all-in-one rebuild SL3000 three-piece (25.12)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm99999/immortalwrt.git main
