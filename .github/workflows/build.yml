name: build-sl3000-openwrt-2512

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  WORK_DIR: ${{ github.workspace }}/openwrt_2512
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-25.12

jobs:
  build-sl3000-2512:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Prepare build directory
        run: |
          sudo rm -rf "${{ env.WORK_DIR }}"
          mkdir -p "${{ env.WORK_DIR }}"

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth=1 -b "${{ env.SOURCE_BRANCH }}" "${{ env.SOURCE_REPO }}" "${{ env.WORK_DIR }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip \
            rsync unzip zlib1g-dev file ccache
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-2512-${{ github.sha }}
          restore-keys: |
            ccache-2512-

      # ============================================================
      # 三件套闭环
      # ============================================================

      - name: Override MK (覆盖官方 filogic.mk)
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Overriding official filogic.mk..."
          cp -v "$GITHUB_WORKSPACE/repo/target/linux/mediatek/image/filogic.mk" \
                target/linux/mediatek/image/filogic.mk

      - name: Run clean-feeds.sh（三件套闭环）
        working-directory: ${{ env.WORK_DIR }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh"
          bash "$GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh"

      - name: Apply CONFIG（激活 sl3000-emmc）
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cp -v "$GITHUB_WORKSPACE/repo/sl3000/config/sl3000.config" .config
          make defconfig

      # ============================================================
      # 构建链
      # ============================================================

      - name: Build tools
        working-directory: ${{ env.WORK_DIR }}
        run: make tools/install -j"$(nproc)" || make tools/install -j1 V=s

      - name: Build toolchain
        working-directory: ${{ env.WORK_DIR }}
        run: make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      - name: Build kernel
        working-directory: ${{ env.WORK_DIR }}
        run: make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Build packages
        working-directory: ${{ env.WORK_DIR }}
        run: make package/compile -j"$(nproc)" || make package/compile -j1 V=s

      - name: Build image
        working-directory: ${{ env.WORK_DIR }}
        run: make -j"$(nproc)" || make -j1 V=s

      # ============================================================
      # 校验 + 上传
      # ============================================================

      - name: Verify final firmware
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo ">>> Checking final firmware..."
          find bin/targets/mediatek/filogic/ -name "*sl3000*" -print \
            || (echo "未生成 sl3000 固件"; exit 1)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-2512-firmware
          path: |
            ${{ env.WORK_DIR }}/bin/targets/mediatek/filogic/*sl3000*

      - name: Release SL3000 Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-2512-${{ github.run_number }}
          name: SL3000 Firmware 25.12 Build ${{ github.run_number }}
          body: |
            自动构建的 SL3000 固件（Open-artifact@v4
        with:
          name: sl3000-2512-firmware
          path: |
            ${{ env.WORK_DIR }}/bin/targets/mediatek/filogic/*sl3000*

      - name: Release SL3000 Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-2512-${{ github.run_number }}
          name: SL3000 Firmware 25.12 Build ${{ github.run_number }}
          body: |
            自动构建的 SL3000 固件（OpenWrt 25.12）
            构建编号：${{ github.run_number }}
          files: |
            ${{ env.WORK_DIR }}/bin/targets/mediatek/filogic/*sl3000*
