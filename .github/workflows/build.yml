name: SL3000-Auto-Release

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 极致磁盘空间清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: 3. 安装完整编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file \
          libelf-dev libncurses-dev python3-pyelftools qemu-utils swig device-tree-compiler

      - name: 4. 克隆 ImmortalWrt 源码 (25.12)
        run: git clone -b openwrt-25.12 --single-branch https://github.com/immortalwrt/immortalwrt openwrt

      - name: 5. 执行 SL3000 资产缝合
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: 6. 预编译工具链 (防止多线程冲突)
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install V=s
          make toolchain/install -j$(nproc) || make toolchain/install V=s

      - name: 7. 执行最终固件构建
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 8. 整理产物
        if: success()
        run: |
          mkdir -p publish
          # 精准拷贝 sl3000 的产物
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*sl3000*" | xargs -I {} cp {} ./publish/
          echo "BUILD_TIME=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 9. 发布 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: SL3000-v25.12-${{ env.BUILD_TIME }}
          files: ./publish/*
          body: |
            ### 🛠️ SL3000 旗舰版固件 (ImmortalWrt 25.12)
            - **内核版本**: 6.12 (GPT Partition)
            - **硬件规格**: 1GB RAM / 128GB eMMC
            - **注入状态**: 三件套全链路自愈成功 ✅
          token: ${{ secrets.GITHUB_TOKEN }}
