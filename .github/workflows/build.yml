name: SL3000-2512-Ultimate-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 磁盘优化与全量依赖安装
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools python3-setuptools \
            swig unzip zlib1g-dev rsync wget file libelf-dev device-tree-compiler qemu-utils

      - name: 3. 克隆源码 (25.12)
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 运行脚本补丁 (执行 128M 物理转换)
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: 5. 预编译工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          ./scripts/feeds update -a && ./scripts/feeds install -a
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 6. 核心物理合体 (🎯 彻底解决 mt7981.dtsi 缺失)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          
          # 1. 找到内核源码中真正的 mt7981.dtsi
          DTSI_PATH=$(find build_dir -name "mt7981.dtsi" | head -n 1)
          echo "📍 找到依赖文件路径: $DTSI_PATH"
          
          # 2. 物理合体：将 dtsi 内容合并入 dts，消除外部依赖
          # 创建一个副本，防止多次运行导致重复注入
          cp -fv ../mt7981b-sl3000-emmc.dts ./combined.dts
          sed -i '/#include "mt7981.dtsi"/r '"$DTSI_PATH" ./combined.dts
          sed -i '/#include "mt7981.dtsi"/d' ./combined.dts
          
          # 3. 物理覆盖所有目标路径
          find build_dir -path "*/arch/arm64/boot/dts" -type d | while read -r DTS_DIR; do
            mkdir -p "$DTS_DIR/mediatek"
            cp -fv ./combined.dts "$DTS_DIR/mediatek/mt7981b-sl3000-emmc.dts"
            cp -fv ./combined.dts "$DTS_DIR/mediatek/mt7981-rfb.dts"
            
            if [ -f "$DTS_DIR/mediatek/Makefile" ]; then
              sed -i '/mt7981b-sl3000-emmc.dtb/d' "$DTS_DIR/mediatek/Makefile"
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$DTS_DIR/mediatek/Makefile"
            fi
          done

      - name: 7. 物理劫持与极限编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 物理劫持 mkhash 防止脚本变量丢失
          HOST_BIN="$(pwd)/staging_dir/host/bin"
          [ -f "$HOST_BIN/mkhash" ] && sudo ln -sf "$HOST_BIN/mkhash" /usr/bin/mkhash || true
          
          # 启动构建
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 8. 发布 Release
        working-directory: ${{ env.WORKDIR }}
        run: |
          FIRMWARE=$(find bin/targets/ -name "*sl3000*.bin" | head -n 1)
          if [ -n "$FIRMWARE" ]; then
            echo "FIRMWARE_PATH=$FIRMWARE" >> $GITHUB_ENV
          else
            echo "❌ 固件未生成！"
            exit 1
          fi

      - name: 9. 上传
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Final-v6-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
