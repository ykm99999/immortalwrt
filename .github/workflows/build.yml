name: Enterprise_Flagship_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 [审计] 生产环境物理净空"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 [审计] 旗舰级依赖补全"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 [审计] 拉取旗舰专属源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ [审计] 注入专属截断补丁"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 [阶段一] 构建企业级工具链"
        working-directory: ./openwrt
        run: |
          make defconfig
          printf '\n' | make oldconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      - name: "🔨 [阶段二] 锁定引导程序 (FIP/U-Boot)"
        working-directory: ./openwrt
        run: |
          # 物理强制编译引导核心，确保旗舰镜像的心脏产出
          make package/boot/uboot-mediatek/compile -j$(nproc) V=s || true
          make package/boot/atf-mediatek/compile -j$(nproc) V=s || true

      - name: "🔨 [阶段三] 生成旗舰最终镜像"
        working-directory: ./openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: "📦 [收割] 企业级产物物理审计"
        run: |
          mkdir -p "flagship_dist"
          # 定向物理收集
          cp -v openwrt/bin/targets/mediatek/filogic/*3000-emmc*sysupgrade.bin flagship_dist/SL3000-Enterprise.bin || true
          cp -v openwrt/bin/targets/mediatek/filogic/*.fip flagship_dist/SL3000-FIP-Flash.bin || true
          # 物理扫描备份所有引导链路二进制件
          sudo find openwrt/bin/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl31*" \) -exec cp -v {} flagship_dist/ \; || true
          cp -v openwrt/.config flagship_dist/flagship_config.txt

      - name: "🚀 [发布] 旗舰镜像上线"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Flagship-V${{ github.run_number }}
          files: flagship_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
