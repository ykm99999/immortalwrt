name: SL3000-Final-Standard

on:
  workflow_dispatch:

env:
  WORKDIR: immortalwrt
  ASSET_DIR: custom-repo

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk m4 rsync unzip device-tree-compiler bc dos2unix

      - name: 2. Clone Sources
        run: |
          # 克隆主源码
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}
          # 明确克隆到 custom-repo 目录
          git clone https://github.com/${{ github.repository }}.git ${{ env.ASSET_DIR }}

      - name: 3. 执行终极补丁
        working-directory: ${{ env.WORKDIR }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 确保脚本位置正确
          cp -v ../${{ env.ASSET_DIR }}/scripts/clean-feeds.sh ./
          chmod +x clean-feeds.sh
          ./clean-feeds.sh

      - name: 4. 构建工具与内核
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # 预先安装内核，确保打包依赖生成
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s

      - name: 5. 路径暴力对齐与最终打包
        working-directory: ${{ env.WORKDIR }}
        run: |
          BUILD_PARENT=$(find build_dir -name "target-aarch64_cortex-a53_musl" -type d | head -n 1)
          if [ -d "$BUILD_PARENT" ]; then
            cd "$BUILD_PARENT"
            # 将任何 root-* 目录链接为 root-mediatek，解决打包报错
            REAL_ROOT=$(ls -d root-* 2>/dev/null | grep -v "mediatek$" | head -n 1)
            [ -n "$REAL_ROOT" ] && ln -snf "$REAL_ROOT" root-mediatek
            cd -
          fi
          make -j$(nproc) || make -j1 V=s

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1GB-Final
          path: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
