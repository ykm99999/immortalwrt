name: Enterprise_Flagship_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境物理净空"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 依赖补全与物理 Swap 修复"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆专属源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 物理缓存配置"
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/dl
          key: ${{ runner.os }}-openwrt-sl3000-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-sl3000-

      - name: "⚡ 执行物理外科修复 (物理修正 PKG_BUILD_DIR)"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 分阶段物理构建"
        working-directory: ./openwrt
        run: |
          # 物理粉碎脏包，强制下载新注入的源码
          rm -rf dl/u-boot-* dl/atf-*
          rm -rf build_dir/target-*/linux-mediatek_filogic/u-boot-*
          rm -rf build_dir/target-*/linux-mediatek_filogic/arm-trusted-firmware-*
          
          make defconfig
          printf '\n' | make oldconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install
          
          # 物理锁定独立编译核心组件
          make package/boot/uboot-mediatek/compile -j1 V=s
          make package/boot/atf-mediatek/compile -j1 V=s
          make -j$(nproc) || make -j1 V=s

      - name: "📦 产物定向收割"
        run: |
          mkdir -p "dist"
          cp -v openwrt/bin/targets/mediatek/filogic/*3000-emmc*sysupgrade.bin dist/SL3000-Exclusive.bin || true
          cp -v openwrt/bin/targets/mediatek/filogic/*.fip dist/SL3000-FIP.bin || true
          sudo find openwrt/bin/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl31*" \) -exec cp -v {} dist/ \; || true
          cp -v openwrt/.config dist/enterprise_config.txt

      - name: "🚀 发布旗舰镜像"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Flagship-V${{ github.run_number }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
