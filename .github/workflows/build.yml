name: Build ImmortalWrt SL3000 eMMC
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            openwrt/.ccache
          key: ${{ runner.os }}-sl3000-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sl3000-

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache libncurses-dev libssl-dev python3 bison flex gawk dwarves

      - name: Run clean-feeds.sh
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: Download all dependencies
        run: cd openwrt && make download -j$(nproc)

      - name: Compile toolchain
        run: cd openwrt && make toolchain/compile -j$(nproc)

      - name: Compile target/linux
        run: cd openwrt && make target/linux/compile -j$(nproc)

      - name: Compile packages
        run: cd openwrt && make package/compile -j$(nproc)

      - name: Package install
        run: cd openwrt && make package/install -j$(nproc)

      - name: Build firmware
        run: cd openwrt && make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt7981b-sl3000-emmc
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
