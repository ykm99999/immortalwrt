name: SL3000-25.12-Final-Fix

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 延续修复：磁盘扩容 (12G Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 安装依赖与克隆 25.12 源码
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 开启独立隔离缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-openwrt-25.12-${{ hashFiles('sl3000.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-

      - name: 5. 准备自定义文件并注入
        run: |
          mkdir -p ${{ env.WORKDIR }}/custom_files
          # ✅ 路径死锁：从仓库根目录拷贝三件套
          cp -fv mt7981b-sl3000-emmc.dts ${{ env.WORKDIR }}/custom_files/
          
          # ✅ 脚本路径死锁：scripts/clean-feeds.sh
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: 6. 编译工具链 (延续环境变量修复)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. 🚀 关键修复：暴力注入 DTS (解决 4176 行报错)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 先让内核准备好目录结构
          make target/linux/prepare -j$(nproc)
          
          # ✅ 动态定位 25.12 (6.12内核) 的所有 DTS 路径
          # 这样无论编译器在哪个 build_dir 找，都能找到文件
          DTS_DESTS=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d)
          
          for dest in $DTS_DESTS; do
            echo "🎯 注入 DTS 到: $dest"
            cp -fv "custom_files/mt7981b-sl3000-emmc.dts" "$dest/"
            
            # 兼容性同步：防止编译器寻找不带 'b' 的旧名称
            cp -fv "$dest/mt7981b-sl3000-emmc.dts" "$dest/mt7981-sl3000-emmc.dts"
            
            # 注册到 Makefile
            sed -i '/sl3000-emmc.dtb/d' "$dest/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dest/Makefile"
          done

      - name: 8. 执行编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 延续 PATH 劫持
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make target/linux/compile -j$(nproc) V=s
          make target/install -j$(nproc) V=s

      - name: 9. 发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
