name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境准备"
        run: |
          sudo apt update && sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3-distutils python3-pyelftools \
            rsync unzip zlib1g-dev swig device-tree-compiler wget curl

      - name: "📂 克隆源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 补丁注入"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "构建系统与 FIP"
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a && ./scripts/feeds install -a
          make defconfig
          # 编译工具链与内核
          make target/linux/install -j$(nproc) DEVICE_sl3000-emmc=y
          # 编译 U-Boot 专用组件
          make package/boot/uboot-mediatek/compile -j$(nproc)
          make package/boot/atf-mediatek/compile -j$(nproc)

      - name: "📦 物理提取产物"
        working-directory: ./openwrt
        run: |
          OUTPUT_DIR="bin/targets/mediatek/filogic"
          # 🚀 提取 2MB U-Boot (FIP)
          find build_dir/ -name "*fip.bin" -exec cp -v {} "$OUTPUT_DIR/SL3000-Uboot-FIP.bin" \;
          
          # 🚀 提取 40MB 系统固件
          FAC_FILE=$(ls "$OUTPUT_DIR"/*sl3000-emmc*factory.bin | head -n 1)
          cp -v "$FAC_FILE" "$OUTPUT_DIR/SL3000-System-Factory.bin"
          
          cd "$OUTPUT_DIR"
          sha256sum SL3000-Uboot-FIP.bin SL3000-System-Factory.bin > sha256sums.txt

      - name: "🚀 发布固件"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Uboot-And-System
          files: |
            openwrt/bin/targets/mediatek/filogic/SL3000-Uboot-FIP.bin
            openwrt/bin/targets/mediatek/filogic/SL3000-System-Factory.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
