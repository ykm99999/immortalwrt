name: SL3000_Ultimate_Step_Build

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 步骤1：磁盘空间极致优化 (物理腾空)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*
          docker rmi $(docker images -q) || true

      - name: "📦 步骤2：安装物理构建依赖与 Swap 修复"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-pyelftools rsync unzip swig \
            device-tree-compiler wget curl tar pkg-config cmake
          
          # 🔥 物理修复 Text file busy: 先关闭可能存在的交换文件并重新创建
          sudo swapoff /swapfile || true
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 16G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile

      - name: "📂 步骤3：克隆专用源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 步骤4：执行物理外科手术 (锁定配置)"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 步骤5：构建工具链 (Stage 1 - Tools & Toolchain)"
        working-directory: ./openwrt
        run: |
          make defconfig
          echo "Building Tools (Verbose)..."
          make tools/install -j$(nproc) V=s || make tools/install -j1 V=s
          echo "Building Toolchain (Verbose)..."
          make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

      - name: "🔨 步骤6：构建固件与 U-Boot (Stage 2 - Firmware)"
        working-directory: ./openwrt
        run: |
          # 物理锁定单线程编译引导程序
          echo "Building Bootloaders (U-Boot/ATF)..."
          make package/boot/uboot-mediatek/compile V=s -j1
          make package/boot/atf-mediatek/compile V=s -j1
          # 总攻固件
          echo "Building Final Images..."
          make -j$(nproc) V=s || make -j1 V=s

      - name: "📦 步骤7：产物物理定向收割"
        run: |
          mkdir -p "dist"
          # 收集系统镜像
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*3000-emmc*sysupgrade.bin" -exec cp -v {} dist/SL3000-Firmware.bin \;
          # 收集并锁定 u-boot 固件
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*u-boot*" -exec cp -v {} dist/ \; || true
          find openwrt/build_dir/target-aarch64_cortex-a53_musl/u-boot-2024.10/ -type f -name "u-boot.bin" -exec cp -v {} dist/u-boot-sl3000-raw.bin \; || true
          cp -v openwrt/.config dist/config.txt

      - name: "🚀 步骤8：自动发布旗舰固件"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Flagship-${{ github.run_number }}
          files: dist/*
          body: |
            SL3000 (MT7981) 企业级构建成功
            - 物理修复：解决了 Swap 文件 Text file busy 占用问题
            - 编译优化：开启详细日志，分步物理隔离
            - 状态：全流程通过静核审计
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
