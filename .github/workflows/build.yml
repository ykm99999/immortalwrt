name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 磁盘空间与12G Swap
        run: |
          sudo rm -rf /usr/share/dotnet /android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo docker prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: 3. 克隆源码
        run: |
          [ -d "openwrt" ] || git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 5. 运行补丁脚本
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: 6. 编译工具链
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make package/opkg/host/compile -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 8. 编译固件
        run: |
          cd openwrt
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/compile -j$(nproc) || make package/compile -j1 V=s
          make package/index -j1 V=s || echo "跳过签名"
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install DEVICE_sl3000-emmc=y -j1 V=s

      - name: 9. 收集固件
        if: always()
        run: |
          mkdir -p release_bins
          find openwrt/bin/targets -name "*sysupgrade.bin" -size +10M -exec cp {} release_bins/ \;

      - name: 10. 发布Release
        uses: softprops/gh-release@v2
        if: always()
        with:
          tag_name: build-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}
