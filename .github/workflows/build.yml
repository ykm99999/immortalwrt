name: SL3000-2512-V612-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装编译依赖
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools python3-setuptools \
            swig unzip zlib1g-dev rsync wget file libelf-dev device-tree-compiler qemu-utils

      - name: 3. 克隆源码 (25.12)
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 执行补丁脚本
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: 5. 编译基础工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 6. 核心物理合体 (🎯 针对 files-6.12 深度注入)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 定义源文件所在的 6.12 物理路径
          SRC_DTS_PATH="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek"
          
          echo "==== [执行多级物理依赖注入] ===="
          # 创建一个完全自洽的临时 DTS
          cp -fv ../mt7981b-sl3000-emmc.dts ./combined.dts
          
          # 🎯 物理注入第一层：mt7981b.dtsi
          if [ -f "$SRC_DTS_PATH/mt7981b.dtsi" ]; then
             sed -i '/#include "mt7981b.dtsi"/r '"$SRC_DTS_PATH/mt7981b.dtsi" ./combined.dts
          fi
          
          # 🎯 物理注入第二层：mt7981.dtsi
          if [ -f "$SRC_DTS_PATH/mt7981.dtsi" ]; then
             sed -i '/#include "mt7981.dtsi"/r '"$SRC_DTS_PATH/mt7981.dtsi" ./combined.dts
          fi

          # 🎯 物理抹除所有 include 引用，防止编译器二次查找
          sed -i '/#include "mt7981.dtsi"/d' ./combined.dts
          sed -i '/#include "mt7981b.dtsi"/d' ./combined.dts
          
          echo "==== [全路径强制分发] ===="
          make target/linux/prepare -j$(nproc)
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r DTS_DIR; do
            cp -fv ./combined.dts "$DTS_DIR/mt7981b-sl3000-emmc.dts"
            cp -fv ./combined.dts "$DTS_DIR/mt7981-rfb.dts"
            
            if [ -f "$DTS_DIR/Makefile" ]; then
              sed -i '/mt7981b-sl3000-emmc.dtb/d' "$DTS_DIR/Makefile"
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$DTS_DIR/Makefile"
            fi
          done

      - name: 7. 最终构建固件
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 物理劫持 mkhash 工具链
          HOST_BIN="$(pwd)/staging_dir/host/bin"
          [ -f "$HOST_BIN/mkhash" ] && sudo ln -sf "$HOST_BIN/mkhash" /usr/bin/mkhash || true
          
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 8. 发布 Release
        working-directory: ${{ env.WORKDIR }}
        run: |
          FIRMWARE=$(find bin/targets/ -name "*sl3000*.bin" | head -n 1)
          if [ -n "$FIRMWARE" ]; then
            echo "FIRMWARE_PATH=$FIRMWARE" >> $GITHUB_ENV
          else
            echo "❌ 固件生成失败" && exit 1
          fi

      - name: 9. 上传
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Final-6.12-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
