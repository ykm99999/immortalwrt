name: Build_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境清理"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hosttoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 环境补全"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 执行物理补丁"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 构建工具链"
        working-directory: ./openwrt
        run: |
          make defconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      - name: "🔨 构建固件"
        working-directory: ./openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          cp .config bin/targets/mediatek/filogic/3000-emmc.config || true

      - name: "📦 固件归集"
        working-directory: ./openwrt/bin/targets/mediatek/filogic
        run: |
          SYS_FILE=$(ls *3000-emmc*sysupgrade.bin 2>/dev/null | head -n 1)
          [ -n "$SYS_FILE" ] && cp -v "$SYS_FILE" SL3000-Final-sysupgrade.bin
          sha256sum *.bin 2>/dev/null > sha256sums.txt

      - name: "🚀 自动发布"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-V${{ github.run_number }}
          files: |
            openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
