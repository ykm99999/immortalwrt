name: SL3000-25.12-Final-System

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 磁盘自愈 (12G Swap)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          # 🎯 唯一物理修复：先关闭 swap 解决 Text file busy，确保 fallocate 成功
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 3. 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev

      - name: 4. 克隆 25.12 源码
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 5. 运行补丁脚本 (🎯 对齐你的 scripts/clean-feeds.sh)
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: 6. 编译工具链 (稳健版)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 7. 内核 DTS 注入 (🎯 从根目录读取 DTS)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            # 🎯 从根目录拷贝 DTS 注入内核
            cp -fv ../mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            # 物理补偿 25.12 包含路径
            ln -sf . "$K_DTS_DIR/mediatek"
            sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          fi

      - name: 8. 执行全量编译 (延续 root-mediatek 修复)
        working-directory: ${{ env.WORKDIR }}
        run: |
          for d in build_dir/target-*; do
            [ -d "$d" ] && mkdir -p "$d/root-mediatek"
          done
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make target/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 9. 发布产物
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
