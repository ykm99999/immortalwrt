name: build-sl3000-2512

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ============================================================
    # 0. Checkout
    # ============================================================
    - name: Checkout repo
      uses: actions/checkout@v4

    # ============================================================
    # 1. Prepare build directory
    # ============================================================
    - name: Prepare /mnt/openwrt
      run: |
        sudo rm -rf /mnt/openwrt
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt

    # ============================================================
    # 2. Clone ImmortalWrt 25.12
    # ============================================================
    - name: Clone ImmortalWrt 25.12
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git /mnt/openwrt
        cd /mnt/openwrt
        git checkout openwrt-25.12

    # ============================================================
    # 3. Install dependencies
    # ============================================================
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-pip \
          rsync unzip zlib1g-dev file ccache

    # ============================================================
    # 4. Cache ccache
    # ============================================================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # ============================================================
    # 5. Reset feeds.conf
    # ============================================================
    - name: Reset feeds.conf
      working-directory: /mnt/openwrt
      run: |
        rm -f feeds.conf
        cp feeds.conf.default feeds.conf

    # ============================================================
    # 6. Ensure scripts executable
    # ============================================================
    - name: Ensure scripts executable
      run: |
        chmod +x $GITHUB_WORKSPACE/scripts/*.sh || true

    # ============================================================
    # 7. Update feeds
    # ============================================================
    - name: Update feeds
      working-directory: /mnt/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================================
    # 8. Run clean-feeds.sh (三件套注册)
    # ============================================================
    - name: Run clean-feeds.sh
      working-directory: /mnt/openwrt
      run: |
        bash $GITHUB_WORKSPACE/scripts/clean-feeds.sh

    # ============================================================
    # 9. Apply CONFIG
    # ============================================================
    - name: Apply CONFIG
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/sl3000/config/sl3000.config .config
        make defconfig

    # ============================================================
    # 10. Verify CONFIG loaded
    # ============================================================
    - name: Verify CONFIG loaded
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Checking CONFIG..."
        grep -q "CONFIG_TARGET_mediatek" .config \
          && echo "CONFIG 已加载" \
          || (echo "CONFIG 未加载"; exit 1)

    # ============================================================
    # 11. Download sources
    # ============================================================
    - name: Download sources
      working-directory: /mnt/openwrt
      run: make download -j8 || make download -j1 V=s

    # ============================================================
    # 12. Build tools
    # ============================================================
    - name: Build tools
      working-directory: /mnt/openwrt
      run: make tools/install -j$(nproc) || make tools/install -j1 V=s

    # ============================================================
    # 13. Build toolchain
    # ============================================================
    - name: Build toolchain
      working-directory: /mnt/openwrt
      run: make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    # ============================================================
    # 14. Build OpenSSL
    # ============================================================
    - name: Build OpenSSL
      working-directory: /mnt/openwrt
      run: make package/libs/openssl/compile -j$(nproc) || make package/libs/openssl/compile -j1 V=s

    # ============================================================
    # 15. Apply DTS
    # ============================================================
    - name: Apply DTS
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/sl3000/dts/mt7981b-sl-3000-emmc.dts target/linux/mediatek/dts/

    # ============================================================
    # 16. Apply MK
    # ============================================================
    - name: Apply MK
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/sl3000/mk/filogic-sl3000.mk target/linux/mediatek/image/

    # ============================================================
    # 17. Verify DTS compiled
    # ============================================================
    - name: Verify DTS compiled
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Checking DTS..."
        find build_dir/ -name "*sl-3000*.dtb" -print -quit \
          || (echo "DTS 未被编译"; exit 1)

    # ============================================================
    # 18. Verify MK applied
    # ============================================================
    - name: Verify MK applied
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Checking MK..."
        grep -R "sl3000" -n target/linux/mediatek/image/ \
          || (echo "MK 未被加载"; exit 1)

    # ============================================================
    # 19. Build firmware
    # ============================================================
    - name: Build firmware
      working-directory: /mnt/openwrt
      run: make -j$(nproc) || make -j1 V=s

    # ============================================================
    # 20. Verify final firmware
    # ============================================================
    - name: Verify final firmware
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Checking final firmware..."
        find bin/targets/ -name "*sl3000*" -print -quit \
          || (echo "未生成 sl3000 固件"; exit 1)

    # ============================================================
    # 21. Upload firmware
    # ============================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-25.12
        path: /mnt/openwrt/bin/targets
