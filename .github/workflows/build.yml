name: SL3000-Factory-Final-Ultra-2512

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 磁盘与内存自愈 (12G Swap)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 3. 安装依赖 (100% 原文还原)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev

      - name: 4. 克隆源码体系 (🎯 锁定 25.12 分支)
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 5. 开启状态缓存 (100% 原文还原)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-openwrt-ultra-v2512

      - name: 6. 运行加固补丁 (🎯 延续历史修复)
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: 7. 编译工具链 (🎯 彻底修复：对齐 25.12 结构)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          make tools/install -j$(nproc)
          # 🎯 25.12 中 fwtool 已并入 firmware-utils，执行此命令实现重编打包工具
          make tools/firmware-utils/compile V=s
          make toolchain/install -j$(nproc)

      - name: 8. 内核/DTS 延续注入 (🎯 物理对齐根目录)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv ../mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
          sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
          echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"

      - name: 9. 极限封包编译 (🎯 彻底修复：动态路径劫持)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 🎯 动态定位 fwtool 真实路径并建立系统硬链接，解决 Error 127
          FWTOOL_REAL_PATH=$(find staging_dir/host/bin/ -name "fwtool" | head -n 1)
          if [ -n "$FWTOOL_REAL_PATH" ]; then
            sudo ln -sf "$(pwd)/$FWTOOL_REAL_PATH" /usr/bin/fwtool
          fi
          sudo ln -sf $(pwd)/staging_dir/host/bin/opkg /usr/bin/opkg || true
          export PATH=$(pwd)/staging_dir/host/bin:$PATH
          
          mkdir -p build_dir/target-aarch64_cortex-a53_musl/root-mediatek
          make target/linux/compile -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 10. 产物物理对齐校验 (🎯 100% 原文还原)
        working-directory: ${{ env.WORKDIR }}
        run: |
          FIRMWARE=$(find bin/targets/mediatek/filogic/ -name "*sysupgrade.bin" | head -n 1)
          if [ -z "$FIRMWARE" ]; then echo "❌ 固件未生成！" && exit 1; fi
          SIZE=$(stat -c%s "$FIRMWARE")
          echo "📏 产物大小: $SIZE 字节"
          if [ $SIZE -lt 134217728 ]; then
             echo "❌ 警告：固件未达到 128MB 工厂规格！"
          else
             echo "✅ 校验通过。"
          fi

      - name: 11. 发布极限交付产物
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Factory-2512-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
