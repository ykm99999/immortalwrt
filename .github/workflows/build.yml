name: Build ImmortalWrt for SL3000

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 最大化构建磁盘空间
        run: |
          echo "=== 释放磁盘空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /var/lib/docker /var/lib/gems /var/lib/flatpak /var/lib/snapd
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          docker rmi $(docker images -q) 2>/dev/null || true
          df -h

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/coolsnowwolf/lede/master/scripts/debian-22.04-utils)
          sudo -E apt-get -qq autoremove --purge
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GID /workdir
          ln -sf /workdir $HOME/openwrt

      - name: 克隆源码
        working-directory: ${{ env.HOME }}
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 加载自定义 feeds
        run: |
          [ -f $FEEDS_CONF ] && sed -i 's/^#\(.*helloworld\)/\1/' $FEEDS_CONF || true
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          [ -d files ] && cp -r files openwrt/ || true
          [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config || true
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 下载依赖
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          DEVICE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 检查空间占用
        if: steps.compile.outputs.status == 'success'
        run: |
          df -hT
          du -h openwrt/bin/targets/

      - name: 查找固件文件（最终修复版）
        if: steps.compile.outputs.status == 'success'
        id: find_firmware
        run: |
          cd openwrt
          echo "=== 查看 bin/targets 目录结构 ==="
          ls -la bin/targets 2>/dev/null
          ls -la bin/targets/*/* 2>/dev/null

          BIN=$(find bin/targets -type f -name "*.bin" | grep -i -E "sl3000|mt7981|sysupgrade" | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find bin/targets -type f -name "*sysupgrade*.bin" | head -1)
          fi

          if [ -z "$BIN" ]; then
            echo "::error::未找到固件"
            exit 1
          fi

          echo "FIRMWARE_PATH=$BIN" >> $GITHUB_ENV
          FIRMWARE_FILENAME=$(basename "$BIN")
          echo "FIRMWARE_FILENAME=$FIRMWARE_FILENAME" >> $GITHUB_ENV
          if echo "$FIRMWARE_FILENAME" | grep -q "sysupgrade"; then
            echo "FIRMWARE_TYPE=sysupgrade" >> $GITHUB_ENV
          else
            echo "FIRMWARE_TYPE=factory" >> $GITHUB_ENV
          fi

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          mkdir -p firmware
          cp -f "$FIRMWARE_PATH" firmware/
          cp -f .config firmware/config.buildinfo
          cd firmware
          FIRMWARE_ZIP="SL3000-${{ env.FILE_DATE }}-firmware.zip"
          zip -r -j "$FIRMWARE_ZIP" ./*
          echo "FIRMWARE_ZIP=$FIRMWARE_ZIP" >> $GITHUB_ENV

      - name: 上传固件文件
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: openwrt/firmware

      - name: 生成发布信息
        id: tag
        run: |
          echo "tag_name=build_$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
          echo "release_name=SL3000 (${{ env.DEVICE_NAME }}) 固件 $(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT
          echo "body=司络 SL3000 (MT7981B) 自动编译固件
          设备: ${{ env.DEVICE_NAME }}
          固件: ${{ env.FIRMWARE_FILENAME }}
          类型: ${{ env.FIRMWARE_TYPE }}" >> $GITHUB_OUTPUT

      - name: 删除旧发布
        uses: dev-drprasad/delete-older-releases@v0.2.1
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Release
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.tag.outputs.release_name }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          body: ${{ steps.tag.outputs.body }}
          files: |
            openwrt/firmware/${{ env.FIRMWARE_ZIP }}
            openwrt/${{ env.FIRMWARE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
