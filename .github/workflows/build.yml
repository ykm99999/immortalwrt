name: Build ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt update
          sudo apt -y install build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-distutils

      - name: Clean Cache
        run: |
          rm -rf bin
          rm -rf tmp
          make clean || true
          make dirclean || true

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config
        run: |
          cp .config.old .config || true
          make defconfig

      - name: Compile Firmware
        run: |
          make V=s -j$(nproc) || make V=s -j1
        shell: bash

      - name: 🔍 Auto Check Why No Firmware
        run: |
          echo "============= CHECK FIRMWARE FILES ============="
          find bin/targets -type f -name "*.bin" -o -name "*.img" -o -name "*.itb" -o -name "*.manifest" | sort
          echo "============= CHECK CONFIG DEVICE ============="
          grep "CONFIG_TARGET" .config | head -10
          echo "============= CHECK BIN DIR ============="
          ls -la bin/targets 2>/dev/null || echo "NO FIRMWARE GENERATED!!!"

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_id }}
          files: |
            bin/targets/**/*.bin
            bin/targets/**/*.img
            bin/targets/**/*.itb
            bin/targets/**/*.manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
