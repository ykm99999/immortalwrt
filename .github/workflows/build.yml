name: build-sl3000-2512

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ============================================================
    # 0. Checkout
    # ============================================================
    - name: Checkout repo
      uses: actions/checkout@v4

    # ============================================================
    # 1. 准备构建目录
    # ============================================================
    - name: Prepare /mnt/openwrt
      run: |
        sudo rm -rf /mnt/openwrt
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt

    # ============================================================
    # 2. Clone ImmortalWrt 25.12
    # ============================================================
    - name: Clone ImmortalWrt 25.12
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git /mnt/openwrt
        cd /mnt/openwrt
        git checkout openwrt-25.12   # ← 修复分支名

    # ============================================================
    # 3. 安装依赖
    # ============================================================
    - name: Install build dependencies + ccache + tools
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-pip \
          rsync unzip zlib1g-dev file ccache

    # ============================================================
    # 4. Cache ccache
    # ============================================================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # ============================================================
    # 5. 清理 feeds 配置
    # ============================================================
    - name: Clean feeds config
      working-directory: /mnt/openwrt
      run: |
        rm -f feeds.conf
        cp feeds.conf.default feeds.conf   # ← 保留 default，只重建 feeds.conf

    # ============================================================
    # 6. 确保脚本权限
    # ============================================================
    - name: Ensure custom scripts executable
      run: |
        chmod +x $GITHUB_WORKSPACE/scripts/*.sh || true

    # ============================================================
    # 7. Update feeds
    # ============================================================
    - name: Update feeds
      working-directory: /mnt/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================================
    # 8. Run clean-feeds.sh（白名单 + 三件套闭环）
    # ============================================================
    - name: Run clean-feeds.sh (white list)
      working-directory: /mnt/openwrt
      env:
        DTS_PATH: $GITHUB_WORKSPACE/sl3000/dts/mt7981b-sl-3000-emmc.dts
        MK_PATH: $GITHUB_WORKSPACE/sl3000/mk/filogic-sl3000.mk
        CONFIG_PATH: $GITHUB_WORKSPACE/sl3000/config/sl3000.config
      run: |
        bash $GITHUB_WORKSPACE/scripts/clean-feeds.sh

    # ============================================================
    # 9. 禁用 menuconfig
    # ============================================================
    - name: Disable menuconfig globally
      working-directory: /mnt/openwrt
      run: |
        cp $GITHUB_WORKSPACE/sl3000/config/sl3000.config .config
        make defconfig

    # ============================================================
    # 10. 下载源码
    # ============================================================
    - name: Download sources (self-heal)
      working-directory: /mnt/openwrt
      run: make download -j8 || make download -j1 V=s

    # ============================================================
    # 11. Build host tools
    # ============================================================
    - name: Build host tools (self-heal)
      working-directory: /mnt/openwrt
      run: make tools/install -j$(nproc) || make tools/install -j1 V=s

    # ============================================================
    # 12. Build toolchain
    # ============================================================
    - name: Build toolchain (self-heal)
      working-directory: /mnt/openwrt
      run: make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    # ============================================================
    # 13. Build OpenSSL
    # ============================================================
    - name: Build OpenSSL first (self-heal)
      working-directory: /mnt/openwrt
      run: make package/libs/openssl/compile -j$(nproc) || make package/libs/openssl/compile -j1 V=s

    # ============================================================
    # 14. 三件套一致性检测
    # ============================================================
    - name: Detect three-piece consistency
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Detecting DTS/MK/config consistency..."
        sha256sum $GITHUB_WORKSPACE/sl3000/dts/mt7981b-sl-3000-emmc.dts || true
        sha256sum $GITHUB_WORKSPACE/sl3000/mk/filogic-sl3000.mk || true
        sha256sum $GITHUB_WORKSPACE/sl3000/config/sl3000.config || true

    # ============================================================
    # 15. Apply DTS
    # ============================================================
    - name: Apply DTS
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/sl3000/dts/mt7981b-sl-3000-emmc.dts target/linux/mediatek/dts/

    # ============================================================
    # 16. Apply MK
    # ============================================================
    - name: Apply MK
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/sl3000/mk/filogic-sl3000.mk target/linux/mediatek/image/

    # ============================================================
    # 17. Build firmware
    # ============================================================
    - name: Build firmware
      working-directory: /mnt/openwrt
      run: make -j$(nproc) || make -j1 V=s

    # ============================================================
    # 18. 上传固件
    # ============================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-25.12
        path: /mnt/openwrt/bin/targets
