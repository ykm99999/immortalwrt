name: Build ImmortalWrt SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout config
        uses: actions/checkout@v4
        with:
          path: config

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev git wget unzip python3 python3-pip

      - name: Clone ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          path: openwrt

      - name: Clean
        run: |
          cd openwrt
          rm -rf bin tmp
          make clean || true

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build
        run: |
          cd openwrt
          if [ ! -f ../config/.config ]; then
            echo "ERROR: No .config"
            exit 1
          fi
          cp ../config/.config .config
          make defconfig
          make -j$(nproc) V=s || make -j1 V=s
          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed"
            exit 1
          fi
          count=$(find bin/targets -type f | wc -l)
          if [ $count -eq 0 ]; then
            echo "ERROR: No firmware"
            exit 1
          fi

      - name: Show files
        run: |
          cd openwrt
          find bin/targets -type f | sort

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_id }}
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
