name: SL3000-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. [延续修复] 12G Swap 扩容
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. [数字化校验] 物理路径强制锚定
        run: |
          # 严格照抄原文文件名 sl3000.config
          if [ -f "${{ github.workspace }}/sl3000.config" ]; then
            echo "✅ 成功找到配置文件: sl3000.config"
            # 仅通过 -f 修复 same file 报错，保持原文路径逻辑
            cp -fv -f "${{ github.workspace }}/sl3000.config" ./sl3000.config
          else
            echo "❌ 严重错误: 找不到 sl3000.config"
            ls -al ${{ github.workspace }}
            exit 1
          fi

      - name: 4. [数字化缓存] 工具链加速
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/staging_dir/host
            ${{ env.WORKDIR }}/staging_dir/toolchain-*
          key: ${{ runner.os }}-build-cache-${{ hashFiles('sl3000.config', 'filogic.mk') }}
          restore-keys: ${{ runner.os }}-build-cache-

      - name: 5. 环境准备与源码下载
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            grep patch diffutils file findutils coreutils util-linux \
            gzip bzip2 unzip wget perl python3 python3-setuptools \
            libncurses5-dev libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler bc dos2unix rsync qemu-utils fakeroot
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 6. 执行全量集成脚本
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh "${{ github.workspace }}"

      - name: 7. [内核修复] DTS 物理硬注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            cp -fv ../mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK)/a \dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$K_DTS_DIR/Makefile"
          fi

      - name: 8. [数字化产出] 全量编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH="${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH"
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make package/compile -j$(nproc)
          make target/install -j$(nproc)

      - name: 9. 发布旗舰固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-FINAL-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000*
          token: ${{ secrets.GITHUB_TOKEN }}
