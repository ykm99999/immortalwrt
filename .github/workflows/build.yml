name: SL3000-Ultimate-Build

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 检出配置仓库
      uses: actions/checkout@v4

    - name: 2. 清理磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true

    - name: 3. 安装编译依赖
      run: |
        sudo -E apt-get update
        sudo -E apt-get install -y $(curl -fsSL https://is.gd/depends_static_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: 4. 克隆源码
      run: git clone -b openwrt-25.12 --single-branch https://github.com/immortalwrt/immortalwrt openwrt

    - name: 5. 运行自愈脚本 (V7.6)
      run: |
        # 进入源码目录执行脚本，脚本会自动回溯父目录寻找配置
        cd openwrt
        chmod +x ../scripts/clean-feeds.sh
        ../scripts/clean-feeds.sh

    - name: 6. 预编译核心工具
      run: |
        cd openwrt
        make tools/install -j$(nproc) || make tools/install V=s
        make toolchain/install -j$(nproc) || make toolchain/install V=s

    - name: 7. 编译固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 8. 上传固件
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: SL3000-v${{ github.run_number }}
        files: |
          openwrt/bin/targets/mediatek/filogic/*factory.bin
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
