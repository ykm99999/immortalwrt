name: SL3000-25.12-Final-V13.5-Fixed

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 延续修复：环境清理与磁盘扩容 (12G Swap)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 安装依赖与克隆 25.12 源码
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 开启独立隔离缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-openwrt-25.12-${{ hashFiles('sl3000.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-

      - name: 5. 执行自定义补丁注入
        run: |
          # ✅ 路径死锁：脚本永远在 scripts/clean-feeds.sh
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: 6. 编译工具链 (延续 Bison 修复)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. 🚀 暴力修复：内核 DTS 全路径注入 (解决 4176 报错)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 触发内核解压准备
          make target/linux/prepare -j$(nproc)
          
          # ✅ 获取所有可能的 mediatek dts 路径 (适配 25.12 动态目录)
          K_DTS_DIRS=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d)
          
          for D in $K_DTS_DIRS; do
            echo "🎯 强行塞入 DTS 到: $D"
            # 这里的 ../ 指向仓库根目录
            cp -fv "../mt7981b-sl3000-emmc.dts" "$D/"
            
            # 兼容性同步：建立不带 'b' 的软连接，防止编译器找不到文件
            ln -sf "mt7981b-sl3000-emmc.dts" "$D/mt7981-sl3000-emmc.dts"
            
            # 强制注册 Makefile 确保编译生效
            sed -i '/sl3000-emmc.dtb/d' "$D/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$D/Makefile"
          done

      - name: 8. 执行编译 (延续 24.10 成功版逻辑)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 延续路径劫持
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          # 编译目标
          make target/linux/compile -j$(nproc) V=s
          make target/install -j$(nproc) V=s

      - name: 9. 发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
