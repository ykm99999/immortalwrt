name: SL3000-Auto-Release

on:
  workflow_dispatch: # 手动点击运行，不设自动定时

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    # 授予发布权限
    permissions:
      contents: write

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 极致磁盘清理 (确保 128GB 固件空间)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/swift /usr/local/.ghcup
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          df -h

      - name: 3. 安装工厂依赖
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file libelf-dev libncurses-dev python3 python3-pyelftools qemu-utils swig xz-utils patch device-tree-compiler
          sudo -E apt-get clean

      - name: 4. 克隆源码 (ImmortalWrt)
        run: git clone -b openwrt-25.12 --single-branch https://github.com/immortalwrt/immortalwrt openwrt

      - name: 5. 执行三件套【检测-自愈-合并】合一脚本
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: 6. 预编译工具链 (关键)
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install V=s
          make toolchain/install -j$(nproc) || make toolchain/install V=s

      - name: 7. 全量固件编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 8. 整理固件文件
        run: |
          mkdir -p publish
          # 提取 factory 镜像和 sysupgrade 镜像
          cp openwrt/bin/targets/mediatek/filogic/*-factory.bin ./publish/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/*-sysupgrade.itb ./publish/ 2>/dev/null || true
          # 顺便把生成的 .config 备份出来方便以后查阅
          cp openwrt/.config ./publish/sl3000.config.full
          echo "BUILD_TIME=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 9. 自动发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: SL3000-Factory-${{ env.BUILD_TIME }}
          files: ./publish/*
          body: |
            ### 🛠️ SL3000 旗舰版固件 (基于 ImmortalWrt 25.12)
            - **硬件规格**: 1GB RAM / 128GB eMMC
            - **内核版本**: 6.12 (GPT Partition)
            - **注入状态**: 三件套全链路自愈成功 ✅
            - **集成功能**: Docker-CE, Passwall, TurboACC, F2FS
          token: ${{ secrets.GITHUB_TOKEN }}
