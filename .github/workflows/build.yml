name: SL3000-Ultimate-Factory-V4

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出旗舰仓库
        uses: actions/checkout@v4

      - name: 2. [延续修复] 空间清理与 12G Swap 扩容
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo docker image prune -a -f || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. [延续修复] 补全构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            grep patch diffutils file findutils coreutils util-linux \
            gzip bzip2 unzip wget perl python3 python3-setuptools \
            libncurses5-dev libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler bc dos2unix rsync qemu-utils fakeroot
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. [全量集成] 执行专属注入与环境劫持
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh 2>&1 | tee build.log

      - name: 5. [延续修复] 编译工具链 (暴力跳过预检+解决交互报错)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH="${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH"
          # 修复交互报错：欺骗系统有终端环境
          export TERM=xterm
          
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          
          # 使用 oldconfig 自动接受默认配置，防止弹出提示
          make oldconfig || true
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: 6. [全量集成] 内核源码物理加固
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            cp -fv custom_files/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK)/a \dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$K_DTS_DIR/Makefile"
          fi

      - name: 7. [延续修复] 静默全量编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH="${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH"
          export TERM=xterm
          # 连续确认配置，确保递归依赖被自动跳过
          make defconfig
          make oldconfig
          make target/linux/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make package/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make target/install -j$(nproc) 2>&1 | tee -a ../build.log

      - name: 8. 发布旗舰工厂固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-FLAGSHIP-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
