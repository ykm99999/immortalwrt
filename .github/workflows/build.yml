name: SL3000-Factory-Build-FINAL
on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
  TERM: xterm
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout 代码
        uses: actions/checkout@v4

      - name: 2. 工厂环境初始化
        run: |
          set -eo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          sudo apt update -qq
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext libncurses-dev libssl-dev python3-dev python3-distutils rsync unzip zlib1g-dev git wget curl device-tree-compiler libelf-dev qemu-utils
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 3. 清空+克隆源码
        run: |
          set -eo pipefail
          rm -rf "${{ env.WORKDIR }}" 2>/dev/null
          for i in 1 2 3; do git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git "${{ env.WORKDIR }}" && break || sleep 5; done

      - name: 4. 编译缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: factory-${{ runner.os }}-sl3000-${{ github.run_id }}
          restore-keys: factory-${{ runner.os }}-sl3000-

      - name: 5. 脚本&DTS 注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          mkdir -p scripts target/linux/mediatek/dts 2>/dev/null
          [ -d "../scripts" ] && cp -rf ../scripts/. scripts/ 2>/dev/null
          [ -f "../mt7981b-sl3000-emmc.dts" ] && cp -f "../mt7981b-sl3000-emmc.dts" target/linux/mediatek/dts/ 2>/dev/null
          [ -f "../mt7981b-sl3000-emmc.dts" ] && cp -f "../mt7981b-sl3000-emmc.dts" ./ 2>/dev/null
          chmod -R 755 scripts/ 2>/dev/null
          chmod +x scripts/* 2>/dev/null
          [ -f "scripts/sl3000-patch.sh" ] && ./scripts/sl3000-patch.sh || true

      - name: 6. 生成配置 & feeds
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          make defconfig || make defconfig
          ./scripts/feeds clean || true
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true

      - name: 7. 编译工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          make tools/compile -j$(nproc) V=s || make tools/compile -j1 V=s
          make tools/install -j$(nproc) V=s || make tools/install -j1 V=s
          make toolchain/compile -j$(nproc) V=s || make toolchain/compile -j1 V=s
          make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

      - name: 8. DTS 注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          make target/linux/prepare -j$(nproc) V=s || true
          for DTS_DIR in $(find build_dir -type d -name "dts" 2>/dev/null | grep arm64 | head -5); do
            [ -z "${DTS_DIR}" ] && continue
            mkdir -p "${DTS_DIR}/mediatek" 2>/dev/null
            cp -f "../mt7981b-sl3000-emmc.dts" "${DTS_DIR}/mediatek/" 2>/dev/null
            sed -i '/mt7981b-sl3000-emmc/d' "${DTS_DIR}/mediatek/Makefile" 2>/dev/null
            echo "dtb-\$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb" >> "${DTS_DIR}/mediatek/Makefile" 2>/dev/null
          done

      - name: 9. 编译固件
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          make defconfig
          make target/linux/compile -j$(nproc) V=s || make target/linux/compile -j1 V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y V=s || make target/linux/install -j1 DEVICE_${{ env.DEVICE_NAME }}=y V=s

      - name: 10. 提取固件路径
        id: collect
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          BIN=$(find bin/targets -name "*sl3000*factory*.bin" -o -name "*sl3000*sysupgrade*.bin" 2>/dev/null | head -1)
          [ -z "${BIN}" ] && BIN=$(find bin/targets -name "*sl3000*.bin" 2>/dev/null | head -1)
          [ -z "${BIN}" ] && echo "ERROR: 未找到固件" && exit 1
          echo "path=$BIN" >> "$GITHUB_ENV"

      - name: 11. 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-FACTORY-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/${{ env.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
