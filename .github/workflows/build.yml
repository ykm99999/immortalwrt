name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 [极致补全] 环境物理自愈"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆 ImmortalWrt (25.12)"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 缓存恢复"
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-openwrt-2512-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-2512-

      - name: "更新信息流"
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a > /dev/null 2>&1

      - name: "运行补丁脚本"
        # 🚀 此脚本负责注入 .config / DTS / filogic.mk
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "构建工具链"
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: "⚡ 手动保存缓存"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-openwrt-2512-${{ hashFiles('openwrt/include/toplevel.mk') }}

      - name: "🎯 [25.12 适配] 物理硬修复环境注入"
        working-directory: ./openwrt
        run: |
          # 🚀 [物理锁定] 获取绝对路径，解决 cp: cannot stat 报错
          ABS_REPO_ROOT=$(cd .. && pwd)
          OPENWRT_ROOT=$(pwd)

          # 1. 物理展开内核源码 (必须先执行此步，build_dir 才会出现)
          make target/linux/prepare -j$(nproc)
          
          # 2. 🚀 [精准寻址] 定位编译期间动态生成的 DTS 目录
          KERNEL_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          
          if [ -n "$KERNEL_DTS_DIR" ]; then
              echo "🎯 物理锁定内核 DTS 目录: $KERNEL_DTS_DIR"
              cd "$KERNEL_DTS_DIR"
              
              # 🔥 [熔断修复] 映射 mt7981.dtsi，防止编译器找不到文件
              [ -f "mt7981b.dtsi" ] && ln -sf mt7981b.dtsi mt7981.dtsi
              
              # 🔥 [物理强灌] 注入您的 DTS 并覆盖官方模板，确保分区表强制生效
              cp -fv "$ABS_REPO_ROOT/mt7981b-3000-emmc.dts" ./mt7981b-3000-emmc.dts
              cp -fv "$ABS_REPO_ROOT/mt7981b-3000-emmc.dts" ./mt7981-rfb.dts
              
              # 🔥 [头文件桥接] 使用绝对路径建立 dt-bindings 链接，解决编译 fatal error
              mkdir -p "dt-bindings"
              for sub in gpio input interrupt-controller leds pinctrl; do
                ln -sf "$OPENWRT_ROOT/include/dt-bindings/$sub" "./dt-bindings/$sub"
              done
              echo "✅ 环境注入与路径深钻修复完成。"
          else
              echo "❌ 错误：无法定位内核物理路径" && exit 1
          fi

      - name: "构建固件"
        working-directory: ./openwrt
        run: |
          # 🚀 [末端锁定] 强制再次检查分区数值，确保 128MB/1024MB 最终一致性
          sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=.*/CONFIG_TARGET_KERNEL_PARTSIZE=128/' .config
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/' .config
          
          make target/linux/compile -j$(nproc) FORCE=1
          make package/compile -j$(nproc) FORCE=1
          make package/install -j$(nproc) FORCE=1
          # 🎯 物理对齐：锁定设备名称 sl3000-emmc 并关闭签名校验
          make target/linux/install -j1 V=s DEVICE_sl3000-emmc=y IGNORE_ERRORS=1 FORCE=1

      - name: "📦 固件物理归集"
        working-directory: ./openwrt/bin/targets/mediatek/filogic/
        run: |
          echo "🎯 正在整理最终产出固件..."
          # 将可能带 rfb 字样的固件物理复制为 SL3000 最终名称
          for f in *sysupgrade.bin; do
            cp -v "$f" "SL3000-eMMC-Final-sysupgrade.bin"
          done

      - name: "上传固件"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SL3000-25.12-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.bin
