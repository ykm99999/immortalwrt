name: Build ImmortalWrt 25.12 (SL3000 eMMC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出仓库（包含 sl3000-tools 和三件套模板）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 优化磁盘空间
      - name: Optimize disk space
        run: |
          sudo apt-get remove -y --purge azure-cli google-cloud-sdk dotnet powershell mono mysql php android* || true
          sudo apt-get autoremove -y
          sudo apt-get clean

      # 3. 安装构建依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git-core libncurses5-dev \
            zlib1g-dev gawk flex gettext wget unzip python3 python3-distutils \
            file libssl-dev rsync ccache

      # 4. 缓存 dl 和 ccache
      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ${{ runner.os }}-immortalwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-

      # 5. 克隆官方 ImmortalWrt 25.12 源码
      - name: Clone ImmortalWrt 25.12 source
        run: |
          rm -rf openwrt
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "已克隆官方 ImmortalWrt 25.12 源码"

      # 6. 运行三件套生成器（生成模板）
      - name: Generate SL3000 Three-Piece Set
        run: |
          chmod +x sl3000-tools/generate-three-piece.sh
          ./sl3000-tools/generate-three-piece.sh

      # 7. 校验三件套
      - name: Validate Three-Piece Set
        run: |
          chmod +x sl3000-tools/three-piece-check.sh
          ./sl3000-tools/three-piece-check.sh

      # 8. ⭐ 将三件套同步到官方源码目录（files-6.12）
      - name: Sync Three-Piece into official source
        run: |
          # DTS → 官方 files-6.12
          mkdir -p openwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek
          cp target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/*.dts \
             openwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/

          # MK → 官方 image/
          cp target/linux/mediatek/image/filogic.mk openwrt/target/linux/mediatek/image/

          # CONFIG → 官方源码根目录
          cp .config openwrt/.config

      # 9. 更新 feeds
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a

      # 10. 规范化配置
      - name: Normalize config
        run: |
          cd openwrt
          make defconfig

      # 11. 构建工具链
      - name: Build toolchain
        run: |
          cd openwrt
          make toolchain/install -j$(nproc) V=s

      # 12. 构建固件
      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s | tee build.log

      # 13. 上传构建日志
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log

      # 14. 上传固件产物
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-sl3000-emmc
          path: openwrt/bin/targets/mediatek/filogic/

      # 15. 自动发布固件
      - name: Release firmware
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sl3000-emmc-${{ github.run_number }}-${{ github.run_id }}
          name: "SL3000 eMMC Firmware Build #${{ github.run_number }}"
          body: |
            自动构建的 SL3000 eMMC 固件 (ImmortalWrt 25.12 / Linux 6.12)
            - 三件套模板生成成功
            - 三件套已同步到官方源码
            - 工具链构建完成
            - 固件构建完成
          files: |
            openwrt/bin/targets/mediatek/filogic/*
