name: "Build OpenWrt 25.12 SL3000 eMMC (Self-Healing Build on /mnt)"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build-sl3000-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout local repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: "Optimize system disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get remove -y --purge azure-cli google-cloud-sdk dotnet powershell mono mysql-server php android snapd || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /usr/share/doc /usr/share/man
          df -h

      - name: "Fix /mnt permissions"
        run: |
          sudo chown -R runner:runner /mnt
          sudo chmod -R 755 /mnt
          mkdir -p /mnt/openwrt
          df -h

      - name: "Install build dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git-core libncurses5-dev \
            zlib1g-dev gawk flex gettext wget unzip python3 python3-distutils \
            file libssl-dev rsync ccache device-tree-compiler subversion libelf-dev \
            bc bison patch gcc-multilib g++-multilib swig libudev-dev libusb-1.0-0-dev

      - name: "Clone official OpenWrt 25.12 to /mnt"
        run: |
          rm -rf /mnt/openwrt || true
          git clone --depth=1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git /mnt/openwrt

      - name: "Cache downloads & ccache"
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: ${{ runner.os }}-sl3000-2512
          restore-keys: |
            ${{ runner.os }}-sl3000-2512

      - name: "Update & install feeds"
        working-directory: /mnt/openwrt
        run: |
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a

      # 方案一：删除 feeds 里的 mt76，强制用内置版本
      - name: "Remove external mt76 (use built-in version)"
        working-directory: /mnt/openwrt
        run: |
          rm -rf package/feeds/packages/mt76

      - name: "Make defconfig (base)"
        working-directory: /mnt/openwrt
        run: |
          make defconfig

      - name: "Copy SL3000 Three-Piece Set"
        run: |
          cp repo/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts \
             /mnt/openwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/
          cp repo/target/linux/mediatek/image/filogic.mk \
             /mnt/openwrt/target/linux/mediatek/image/
          cp repo/.config /mnt/openwrt/.config

      - name: "Make defconfig (finalize)"
        working-directory: /mnt/openwrt
        run: |
          make defconfig
          echo '===== FINAL CONFIG ====='
          grep SL3000 -n .config || true

      - name: "Self-Heal: tools & toolchain"
        working-directory: /mnt/openwrt
        run: |
          if [ ! -x staging_dir/toolchain-*/bin/*gcc ]; then
            echo '[SELF-HEAL] Toolchain missing → rebuilding'
            make tools/install -j"$(nproc)" V=s
            make toolchain/install -j"$(nproc)" V=s
          else
            echo '[OK] Toolchain already exists'
          fi

      - name: "Self-Heal: kernel prepare"
        working-directory: /mnt/openwrt
        run: |
          if [ ! -f build_dir/target-*/linux-*/linux-*/include/config/auto.conf ]; then
            echo '[SELF-HEAL] Kernel prepare missing → running prepare'
            make target/linux/prepare V=s
          else
            echo '[OK] Kernel prepare already done'
          fi

      - name: "Self-Heal: kernel compile"
        working-directory: /mnt/openwrt
        run: |
          make target/linux/compile V=s || {
            echo '[SELF-HEAL] Kernel compile failed → retrying once'
            make target/linux/compile V=s
          }

      # 不用 heredoc，直接 echo 生成 autoconf.h 兼容层
      - name: "Self-Heal: mt76 backport autoconf shim"
        working-directory: /mnt/openwrt
        run: |
          BP_DIR="staging_dir/target-aarch64_cortex-a53_musl/usr/include/mac80211-backport/backport"
          if [ ! -f "$BP_DIR/autoconf.h" ]; then
            echo '[SELF-HEAL] backport/autoconf.h missing → creating compatibility shim'
            mkdir -p "$BP_DIR"
            {
              echo '/* Compatibility shim for mt76 on OpenWrt 25.12 */'
              echo '/* mac80211-backport/backport/autoconf.h is no longer installed, */'
              echo '/* but some mt76 versions still include it during configure.      */'
              echo ''
              echo '#ifndef __BACKPORT_AUTOCONF_H'
              echo '#define __BACKPORT_AUTOCONF_H'
              echo ''
              echo '/* Minimal stub; extend if build logs require macros. */'
              echo ''
              echo '#endif /* __BACKPORT_AUTOCONF_H */'
            } > "$BP_DIR/autoconf.h"
          else
            echo '[OK] backport/autoconf.h already present'
          fi

      - name: "Self-Heal: WiFi stack (mac80211 + mt76)"
        working-directory: /mnt/openwrt
        run: |
          if [ ! -d staging_dir/target-*/usr/include/mac80211 ]; then
            echo '[SELF-HEAL] mac80211 missing → building'
            make package/kernel/mac80211/compile V=s
          fi

          if [ ! -d staging_dir/target-*/usr/include/mt76 ]; then
            echo '[SELF-HEAL] mt76 missing → building'
            make package/kernel/mt76/compile V=s
          fi

      - name: "Build SL3000 eMMC firmware"
        working-directory: /mnt/openwrt
        env:
          SKIP_TARGET_CHECK: "1"
          FORCE: "1"
        run: |
          make download -j8 || echo '[WARN] download failed'

          for i in 1 2; do
            make -j"$(nproc)" V=s 2>&1 | tee firmware-build.log && break
            echo '[SELF-HEAL] Build failed → retrying'
          done

          test -f firmware-build.log || echo '[ERROR] firmware-build.log missing' > firmware-build.log

      - name: "Upload build logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-2512-build-logs
          path: /mnt/openwrt/firmware-build.log
          retention-days: 7

      - name: "Upload firmware artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-sl3000-emmc-firmware
          path: /mnt/openwrt/bin/targets/mediatek/filogic/
          retention-days: 30

      - name: "Auto Release firmware"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tagname: sl3000-emmc-openwrt-25.12-${{ github.run_number }}-${{ github.run_id }}
          name: SL3000 EMMC OpenWrt 25.12 #${{ github.run_number }}
          body: |
            OpenWrt 25.12 / kernel 6.12
            Target: SL3000 (MT7981B eMMC)
            Auto three-piece (DTS/MK/CONFIG)
            Self-Healing Build System
          files: /mnt/openwrt/bin/targets/mediatek/filogic/*
          prerelease: true
