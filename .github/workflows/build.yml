name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
  CACHE_KEY: sl3000-v2026-ultimate-fix

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 🚀 [极致优化] 腾出磁盘空间 & 12G Swap (全量延续)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 🛡️ [物理缓存] 恢复工具链快照"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-sl3000-

      - name: "4. 克隆源码"
        run: |
          [ -d "${{ env.WORKDIR }}" ] || git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "5. 运行补丁脚本 (补丁全量归位)"
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: "6. 🛠️ [物理封印] 强制钉死工具链 (消除 usign 缺失隐患)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make package/opkg/host/compile -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: "8. ✅ [终极物理对齐] 编译固件 (解决索引签名与 opkg 报错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/compile -j$(nproc) || make package/compile -j1 V=s
          make package/index -j1 V=s || echo "⚠️ Warning: Index signing failed, ignoring..."
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install DEVICE_${{ env.DEVICE_NAME }}=y -j1 V=s

      - name: "9. 📦 [自动打捞] 收集固件"
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: |
          mkdir -p ../../release_bins
          find bin/targets -type f -size +10M -name "*sysupgrade.bin" -exec cp {} ../../release_bins/ \;

      - name: "10. 上传固件"
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: release_bins/

      - name: "11. 🛡️ [物理保存] 封印缓存"
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-${{ env.CACHE_KEY }}
