name: SL3000-Auto-Release-V28

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WORKDIR: ${{ github.workspace }}/immortalwrt
  ASSET_DIR: ${{ github.workspace }}/custom-repo
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af --volumes

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk m4 libtool-bin rsync \
          unzip wget curl patch git-core gettext libncurses-dev zlib1g-dev libssl-dev \
          libelf-dev python3 python3-pip ccache device-tree-compiler bc dos2unix

      - name: 3. Clone Sources
        run: |
          git clone --depth=1 -b ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_REPO }} ${{ env.WORKDIR }}
          git clone https://github.com/${{ github.repository }}.git ${{ env.ASSET_DIR }}

      - name: 4. Execute Auto-Merge (V28.0)
        working-directory: ${{ env.WORKDIR }}
        env:
          CUSTOM_ASSETS: ${{ env.ASSET_DIR }}
        run: |
          cp ${{ env.ASSET_DIR }}/scripts/clean-feeds.sh ./
          chmod +x clean-feeds.sh
          ./clean-feeds.sh

      - name: 5. Kernel Physical Injection & Hook
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo ">>> 正在释放内核源码并同步物理路径..."
          make target/linux/prepare -j$(nproc)
          
          # 动态定位 build_dir 下真实的 Mediatek DTS 目录
          REAL_K_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          
          if [ -n "$REAL_K_DIR" ]; then
            # 从 Step 4 准备好的目录将对齐后的 DTS 拷贝进源码树
            TEMP_DTS=$(find target/linux/mediatek/files-* -name "mt7981b-sl3000-emmc.dts" | head -n 1)
            cp -v "$TEMP_DTS" "$REAL_K_DIR/"
            
            # 物理注册 Makefile：紧跟在官方 rfb 后面
            sed -i '/mt7981-rfb.dtb/a dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$REAL_K_DIR/Makefile"
            
            echo "✅ [物理注入成功] DTS 已进入编译序列。"
          else
            echo "❌ 严重错误：未找到内核构建目录！" && exit 1
          fi

      - name: 6. Build Toolchain
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. Final Compilation
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make -j$(nproc) || make -j1 V=s

      - name: 8. Release Assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-V28-${{ github.run_number }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
