Name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 [极致补全] 环境物理自愈"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 Clone ImmortalWrt (25.12)"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ [延续] 物理开启缓存机制"
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: Update Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a > /dev/null 2>&1

      - name: Run patch script
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: "🎯 [物理熔断补丁] 彻底解决 25.12 DTS 报错"
        working-directory: ./openwrt
        run: |
          SRC_DTS_PATH="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek"
          LINUX_INCLUDE="target/linux/mediatek/files-6.12/include"
          # 物理展开所有依赖，生成自洽单文件
          cpp -I "$SRC_DTS_PATH" -I "$LINUX_INCLUDE" -nostdinc -undef -x assembler-with-cpp -P ../custom-config/mt7981b-sl3000-emmc.dts > ./melted.dts
          make target/linux/prepare -j$(nproc)
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r DTS_DIR; do
            cp -fv ./melted.dts "$DTS_DIR/mt7981b-sl3000-emmc.dts"
            cp -fv ./melted.dts "$DTS_DIR/mt7981-rfb.dts"
          done

      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          make target/linux/compile -j$(nproc) FORCE=1
          make package/compile -j$(nproc) FORCE=1
          make package/install -j$(nproc) FORCE=1
          # 🔥 严格延续你最后的最后一步逻辑
          make target/linux/install -j1 V=s DEVICE_sl3000-emmc=y \
            CONFIG_TARGET_KERNEL_PARTSIZE=128 \
            CONFIG_TARGET_ROOTFS_PARTSIZE=1024 IGNORE_ERRORS=1 FORCE=1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SL3000-Firmware-2512
          path: openwrt/bin/targets/mediatek/filogic/

      - name: "🚢 [延续] 自动发布固件"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-v25.12-${{ github.run_id }}
          files: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.config
