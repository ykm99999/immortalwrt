name: SL3000-BUILD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo apt clean

      - name: 安装依赖
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-dev rsync unzip git wget curl \
            device-tree-compiler libelf-dev qemu-utils

      - name: 拉取源码 24.10
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      # 复制你仓库的三件套
      - name: 部署设备配置
        run: |
          cp mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/
          cp filogic.mk          openwrt/target/linux/mediatek/
          cp sl3000.config       openwrt/.config

      # 官方标准 feeds，不清理、不折腾
      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      # 单线程编译
      - name: 编译工具链
        working-directory: openwrt
        run: |
          make tools/compile -j1 V=s
          make tools/install -j1 V=s
          make toolchain/compile -j1 V=s
          make toolchain/install -j1 V=s

      - name: 编译固件
        working-directory: openwrt
        run: |
          make -j1 V=s

      # 上传
      - name: 查找固件
        working-directory: openwrt
        run: |
          BIN=$(find bin/targets -name "*sl3000*sysupgrade.bin" 2>/dev/null | head -1)
          echo "FIRMWARE_PATH=$BIN" >> $GITHUB_ENV

      - name: 上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: openwrt/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
