name: Build_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1
  GITHUB_WORKSPACE: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境清理（释放约20GB）"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 25.12 依赖补全"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake libelf-dev
          # 12G Swap 适配 25.12 大内核编译
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆 25.12 源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 缓存 dl 目录（提速）"
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-25.12-dl
          restore-keys: ${{ runner.os }}-openwrt-25.12-dl

      - name: "🔧 执行 clean-feeds 补丁（路径+权限修复）"
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: "🔨 工具链+固件一体化构建（25.12 标准）"
        working-directory: ./openwrt
        run: |
          make defconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install
          # 25.12 官方稳定编译命令，失败自动单线程调试
          make -j$(nproc) || make -j1 V=s
          # 备份配置
          cp .config bin/targets/mediatek/filogic/3000-emmc.config || true

      - name: "📦 固件重命名+校验（匹配 3000-emmc）"
        working-directory: ./openwrt/bin/targets/mediatek/filogic
        run: |
          # 匹配你的设备名：3000-emmc
          SYS_FILE=$(ls *3000-emmc*sysupgrade.bin 2>/dev/null | head -1)
          [ -n "$SYS_FILE" ] && cp -v "$SYS_FILE" SL3000-Final-sysupgrade.bin
          # 生成校验
          sha256sum *.bin *.config 2>/dev/null > sha256sums.txt

      - name: "🚀 自动发布（全目录上传，稳健）"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-V${{ github.run_number }}
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
