name: build-sl3000-2512

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ============================================================
    # 0. Checkout（延续工程体系）
    # ============================================================
    - name: Checkout repo
      uses: actions/checkout@v4

    # ============================================================
    # 1. 准备构建目录（延续工程体系）
    # ============================================================
    - name: Prepare /mnt/openwrt
      run: |
        sudo rm -rf /mnt/openwrt
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt

    # ============================================================
    # 2. Clone ImmortalWrt 25.12（延续工程体系）
    # ============================================================
    - name: Clone ImmortalWrt 25.12
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git /mnt/openwrt
        cd /mnt/openwrt
        git checkout openwrt-25.12   # ← 唯一修复点 1

    # ============================================================
    # 3. 安装依赖（Ubuntu 24.04 修复）
    # ============================================================
    - name: Install build dependencies + ccache + tools
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-pip \
          rsync unzip zlib1g-dev file ccache

    # ============================================================
    # 4. Cache ccache（延续工程体系）
    # ============================================================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # ============================================================
    # 5. 清理 feeds 配置（延续工程体系）
    # ============================================================
    - name: Clean feeds config
      working-directory: /mnt/openwrt
      run: |
        rm -f feeds.conf
        rm -f feeds.conf.default
        cp feeds.conf.default feeds.conf   # ← 唯一修复点 2（恢复 feeds.conf）

    # ============================================================
    # 6. Update feeds（延续工程体系）
    # ============================================================
    - name: Update feeds
      working-directory: /mnt/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================================
    # 7. 运行 clean-feeds.sh（白名单 + 三件套闭环）
    # ============================================================
    - name: Run clean-feeds.sh (white list)
      working-directory: /mnt/openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh
        bash $GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh

    # ============================================================
    # 8. 禁用 menuconfig（延续工程体系）
    # ============================================================
    - name: Disable menuconfig globally
      working-directory: /mnt/openwrt
      run: |
        touch .config
        make defconfig

    # ============================================================
    # 9. 下载源码（self-heal 阶段）
    # ============================================================
    - name: Download sources (self-heal)
      working-directory: /mnt/openwrt
      run: make download -j8 || make download -j1 V=s

    # ============================================================
    # 10. Build host tools（self-heal 阶段）
    # ============================================================
    - name: Build host tools (self-heal)
      working-directory: /mnt/openwrt
      run: make tools/install -j$(nproc) || make tools/install -j1 V=s

    # ============================================================
    # 11. Build toolchain（self-heal 阶段）
    # ============================================================
    - name: Build toolchain (self-heal)
      working-directory: /mnt/openwrt
      run: make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    # ============================================================
    # 12. Build OpenSSL（self-heal 阶段）
    # ============================================================
    - name: Build OpenSSL first (self-heal)
      working-directory: /mnt/openwrt
      run: make package/libs/openssl/compile -j$(nproc) || make package/libs/openssl/compile -j1 V=s

    # ============================================================
    # 13. 三件套一致性检测（延续工程体系）
    # ============================================================
    - name: Detect three-piece consistency
      working-directory: /mnt/openwrt
      run: |
        echo ">>> Detecting DTS/MK consistency..."
        sha256sum target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts || true

    # ============================================================
    # 14. Apply DTS（延续工程体系）
    # ============================================================
    - name: Apply DTS
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/repo/sl3000/dts/mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/

    # ============================================================
    # 15. Apply MK（延续工程体系）
    # ============================================================
    - name: Apply MK
      working-directory: /mnt/openwrt
      run: |
        cp -v $GITHUB_WORKSPACE/repo/sl3000/mk/filogic-sl3000.mk target/linux/mediatek/image/

    # ============================================================
    # 16. Build firmware（延续工程体系）
    # ============================================================
    - name: Build firmware
      working-directory: /mnt/openwrt
      run: make -j$(nproc) || make -j1 V=s

    # ============================================================
    # 17. 上传固件（延续工程体系）
    # ============================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-25.12
        path: /mnt/openwrt/bin/targets
