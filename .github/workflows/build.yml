name: SL3000-Auto-Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 磁盘清理与空间释放
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: 3. 安装工具链 (含 DTC)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          device-tree-compiler qemu-utils

      - name: 4. 克隆 ImmortalWrt 源码
        run: git clone -b openwrt-25.12 --single-branch https://github.com/immortalwrt/immortalwrt openwrt

      - name: 5. 执行三件套合并脚本
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: 6. 预编译工具链
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install V=s
          make toolchain/install -j$(nproc) || make toolchain/install V=s

      - name: 7. 执行全量固件编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 8. 整理产物
        if: success()
        run: |
          mkdir -p publish
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*sl3000*" | xargs -I {} cp {} ./publish/
          echo "BUILD_TIME=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 9. 自动发布 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: SL3000-${{ env.BUILD_TIME }}
          files: ./publish/*
          token: ${{ secrets.GITHUB_TOKEN }}
