name: SL3000-Factory-Flagship

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出配置
        uses: actions/checkout@v4

      - name: 2. 工厂环境依赖安装
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file libelf-dev libncurses-dev python3 python3-pyelftools qemu-utils swig xz-utils patch device-tree-compiler
          sudo -E apt-get clean

      - name: 3. 源码检出 (ImmortalWrt)
        run: git clone -b openwrt-25.12 --single-branch https://github.com/immortalwrt/immortalwrt openwrt

      - name: 4. 深度注入与自愈 (V11.0)
        run: |
          cd openwrt
          chmod +x ../scripts/clean-feeds.sh
          ../scripts/clean-feeds.sh

      - name: 5. 预编译工具链
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install V=s
          make toolchain/install -j$(nproc) || make toolchain/install V=s

      - name: 6. 旗舰固件全量编译
        run: |
          cd openwrt
          # 针对 MT7981B 进行 O3 优化加速
          make -j$(nproc) || make -j1 V=s

      - name: 7. 发布工厂镜像
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: SL3000-Factory-v${{ github.run_number }}
          files: openwrt/bin/targets/mediatek/filogic/*.itb
