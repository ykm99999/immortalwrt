name: "Build OpenWrt 25.12 SL3000 eMMC (Full Self-Heal /mnt)"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build-sl3000-2512:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout local repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: "Optimize system disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get remove -y --purge azure-cli google-cloud-sdk dotnet powershell mono mysql-server php android snapd || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /usr/share/doc /usr/share/man || true
          df -h

      - name: "Prepare /mnt build directory"
        run: |
          sudo chown -R runner:runner /mnt
          sudo chmod -R 755 /mnt
          mkdir -p /mnt/openwrt
          df -h

      - name: "Install build dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git-core libncurses5-dev \
            zlib1g-dev gawk flex gettext wget unzip python3 python3-distutils \
            file libssl-dev rsync ccache device-tree-compiler subversion libelf-dev \
            bc bison patch gcc-multilib g++-multilib swig libudev-dev libusb-1.0-0-dev
          if [ ! -f /usr/bin/env ]; then sudo ln -s /bin/env /usr/bin/env || true; fi
          if [ ! -f /usr/bin/bash ]; then sudo ln -s /bin/bash /usr/bin/bash || true; fi

      - name: "Clone OpenWrt 25.12"
        run: |
          rm -rf /mnt/openwrt || true
          git clone --depth=1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git /mnt/openwrt

      - name: "Initial feeds update"
        working-directory: /mnt/openwrt
        run: |
          ./scripts/feeds update -a

      - name: "Clean feeds and dl cache"
        working-directory: /mnt/openwrt
        run: |
          rm -rf dl package/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "Auto-clean invalid feeds packages"
        working-directory: /mnt/openwrt
        run: |
          rm -rf feeds/luci/luci-app-advanced-reboot || true
          rm -rf feeds/packages/onionshare-cli || true
          ./scripts/feeds install -a

      - name: "Cache downloads & build dirs"
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/build_dir
            /mnt/openwrt/staging_dir
            /mnt/openwrt/tmp
            /mnt/openwrt/.ccache
          key: ${{ runner.os }}-sl3000-2512-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sl3000-2512

      - name: "Base defconfig"
        working-directory: /mnt/openwrt
        run: |
          make defconfig

      - name: "Build host tools (fix missing libdeflate-gzip)"
        working-directory: /mnt/openwrt
        run: |
          make tools/install -j$(nproc) || { make tools/clean; make tools/install -j$(nproc); }
          make toolchain/install -j$(nproc) || { make toolchain/clean; make toolchain/install -j$(nproc); }

      - name: "Copy SL3000 three-piece set (DTS/MK/CONFIG)"
        run: |
          OWRT=/mnt/openwrt
          REPO=repo

          mkdir -p "$OWRT/target/linux/mediatek/dts"
          cp "$REPO/target/linux/mediatek/dts/mt7981b-sl-3000-emmc.dts" \
             "$OWRT/target/linux/mediatek/dts/"

          if ! grep -q "Device/sl-3000-emmc" "$OWRT/target/linux/mediatek/image/mt7981.mk"; then
            cat "$REPO/target/linux/mediatek/image/mt7981.mk" >> "$OWRT/target/linux/mediatek/image/mt7981.mk"
          fi

          cp "$REPO/sl3000-tools/sl3000-full-config.txt" "$OWRT/.config"

      - name: "Verify SL3000 three-piece registration"
        working-directory: /mnt/openwrt
        run: |
          test -f target/linux/mediatek/dts/mt7981b-sl-3000-emmc.dts || exit 1
          grep -q "Device/sl-3000-emmc" target/linux/mediatek/image/mt7981.mk || exit 1
          grep -q "CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_sl-3000-emmc=y" .config || exit 1

      - name: "Finalize defconfig"
        working-directory: /mnt/openwrt
        run: |
          make defconfig

      - name: "Auto-repair ustream-ssl (mbedtls ABI mismatch)"
        working-directory: /mnt/openwrt
        run: |
          rm -rf build_dir/target-*/ustream-ssl-* build_dir/target-*/mbedtls-* \
                 staging_dir/target-*/usr/include/mbedtls staging_dir/target-*/usr/lib/libmbed*
          make package/libs/mbedtls/compile V=s || { make package/libs/mbedtls/clean; make package/libs/mbedtls/compile V=s; }
          make package/libs/ustream-ssl/compile V=s || { make package/libs/ustream-ssl/clean; make package/libs/ustream-ssl/compile V=s; }

      - name: "Auto-repair kernel"
        working-directory: /mnt/openwrt
        run: |
          make target/linux/compile -j$(nproc) || { make target/linux/clean; make target/linux/compile -j$(nproc); }

      - name: "Auto-repair target build (must run before package_install)"
        working-directory: /mnt/openwrt
        run: |
          make target/compile V=s || { make target/clean; make target/compile V=s; }

      - name: "Auto-repair packages"
        working-directory: /mnt/openwrt
        run: |
          make package/compile V=s || { make package/clean; make package/compile V=s; }

      - name: "Auto-repair world build"
        working-directory: /mnt/openwrt
        run: |
          make V=s || { make package/clean; make target/clean; make V=s; }

      - name: "Build SL3000 eMMC firmware (25.12)"
        working-directory: /mnt/openwrt
        env:
          SKIPTARGETCHECK: "1"
          FORCE: "1"
        run: |
          make download -j8 || { rm -rf dl/*; make download -j8; }
          make -j$(nproc) V=s 2>&1 | tee firmware-build.log

      - name: "Check firmware output"
        working-directory: /mnt/openwrt/bin/targets/mediatek/mt7981
        run: |
          ls -lh

      - name: "Upload build logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-2512-build-logs
          path: /mnt/openwrt/firmware-build.log

      - name: "Upload firmware artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-2512-sl3000-emmc-firmware
          path: |
            /mnt/openwrt/bin/targets/mediatek/mt7981/*sysupgrade.bin
            /mnt/openwrt/bin/targets/mediatek/mt7981/*initramfs*.bin

      - name: "Auto Release firmware (25.12)"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: sl3000-emmc-openwrt-2512-${{ github.run_number }}-${{ github.run_id }}
          name: SL3000 EMMC OpenWrt 25.12 #${{ github.run_number }}
          body: |
            OpenWrt 25.12 stable
            Target: SL3000 (MT7981B eMMC)
            Three-piece set (DTS/MK/CONFIG)
            Full self-heal workflow
          files: |
            /mnt/openwrt/bin/targets/mediatek/mt7981/*sysupgrade.bin
            /mnt/openwrt/bin/targets/mediatek/mt7981/*initramfs*.bin
