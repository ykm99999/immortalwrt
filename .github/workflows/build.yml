name: SL3000-eMMC-100%SUCCESS-BUILD
on:
  workflow_dispatch:

env:
  OPENWRT_DIR: openwrt
  DEVICE: sl3000-emmc
  TERM: xterm
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /opt/google /opt/microsoft /usr/local/share/chromium
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-dev python3-distutils \
            rsync unzip git wget curl device-tree-compiler libelf-dev qemu-utils

      - name: Clone source
        run: |
          rm -rf "${{ env.OPENWRT_DIR }}"
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git "${{ env.OPENWRT_DIR }}"

      - name: Cache dl packages
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: dl-${{ runner.os }}
          restore-keys: dl-${{ runner.os }}

      - name: Inject DTS and run script
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -eo pipefail
          mkdir -p target/linux/mediatek/dts
          cp -f ../mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/
          chmod +x ../sl3000-patch.sh
          ../sl3000-patch.sh

      - name: Build tools & toolchain
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make tools/compile -j1 V=s
          make tools/install -j1 V=s
          make toolchain/compile -j1 V=s
          make toolchain/install -j1 V=s

      - name: Build firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make -j1 V=s

      - name: Get firmware path
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          BIN=$(find bin/targets -name "*sl3000*sysupgrade*.bin" -o -name "*sl3000*factory*.bin" | head -1)
          echo "FIRMWARE_PATH=$BIN" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-build-${{ github.run_id }}
          files: ${{ env.OPENWRT_DIR }}/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
