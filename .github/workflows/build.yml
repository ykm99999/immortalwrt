name: SL3000-Final-V8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Prepare Space
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk m4 rsync unzip device-tree-compiler bc dos2unix
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: 2. Clone Sources
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone https://github.com/${{ github.repository }}.git custom-repo

      - name: 3. Run Patch Script
        working-directory: immortalwrt
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x ../custom-repo/scripts/clean-feeds.sh
          ../custom-repo/scripts/clean-feeds.sh

      - name: 4. Build Toolchain & Prepare Kernel
        working-directory: immortalwrt
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/prepare -j$(nproc)

      - name: 5. 暴力同步缝合后的 DTS (防报错核心)
        working-directory: immortalwrt
        run: |
          # 找到内核展开后真正的 DTS 存放目录
          K_SRC_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          # 获取我们在第 3 步缝合好的独立版 DTS
          FINAL_DTS=$(find target/linux/mediatek/files-* -name "mt7981b-sl3000-emmc.dts" | head -n 1)
          
          if [ -n "$K_SRC_DTS_DIR" ] && [ -f "$FINAL_DTS" ]; then
             echo "✅ 注入独立版 DTS 到内核源码树: $K_SRC_DTS_DIR"
             cp -fv "$FINAL_DTS" "$K_SRC_DTS_DIR/"
             # 暴力修改 Makefile 强制内核编译它
             sed -i '/mt7981-rfb/a dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$K_SRC_DTS_DIR/Makefile"
          fi

      - name: 6. Final Compilation
        working-directory: immortalwrt
        run: |
          # 路径对齐
          BUILD_PARENT=$(find build_dir -name "target-aarch64_cortex-a53_musl" -type d | head -n 1)
          if [ -d "$BUILD_PARENT" ]; then
            REAL_ROOT=$(ls -d $BUILD_PARENT/root-* 2>/dev/null | head -n 1)
            [ -n "$REAL_ROOT" ] && ln -snf "$REAL_ROOT" "$BUILD_PARENT/root-mediatek"
          fi
          
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make -j$(nproc)

      - name: 7. Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1GB-Final
          path: immortalwrt/bin/targets/mediatek/filogic/*.bin
