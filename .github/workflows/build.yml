name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 [极致补全] 环境物理自愈"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆 ImmortalWrt (25.12)"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 缓存恢复"
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-openwrt-2512-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-2512-

      - name: "更新信息流"
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a > /dev/null 2>&1

      - name: "运行补丁脚本"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "构建工具链"
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: "⚡ 手动保存缓存"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-openwrt-2512-${{ hashFiles('openwrt/include/toplevel.mk') }}

      - name: "构建固件"
        working-directory: ./openwrt
        run: |
          make target/linux/compile -j$(nproc) FORCE=1
          make package/compile -j$(nproc) FORCE=1
          make package/install -j$(nproc) FORCE=1
          make target/linux/install -j1 V=s DEVICE_sl3000-emmc=y IGNORE_ERRORS=1 FORCE=1

      - name: "📦 固件物理归集 (U-Boot 兼容版)"
        working-directory: ./openwrt/bin/targets/mediatek/filogic/
        run: |
          echo "🎯 正在执行最终物理身份锁定..."
          
          # 1. 物理定位编译产出的 fwtool 工具
          FWTOOL_PATH=$(find ../../../../staging_dir/host/bin/ -name fwtool -type f | head -n 1)
          
          # 2. 定位固件
          SYS_FILE=$(ls *sl3000-emmc*sysupgrade.bin | head -n 1)
          FAC_FILE=$(ls *sl3000-emmc*factory.bin | head -n 1)
          
          # 3. [物理硬修复] 注入精准 ID (sl,3000-emmc) 到 sysupgrade
          printf '{"metadata_version":"1.1","compat_version":"1.0","supported_devices":["sl,3000-emmc"],"version":{"dist":"ImmortalWrt","version":"25.12","board":"sl,3000-emmc"}}' > metadata.json
          "$FWTOOL_PATH" -I metadata.json "$SYS_FILE"
          
          # 4. 物理命名归集
          cp -v "$SYS_FILE" SL3000-Final-sysupgrade.bin
          cp -v "$FAC_FILE" SL3000-Uboot-factory.bin
          sha256sum SL3000-Final-sysupgrade.bin SL3000-Uboot-factory.bin > sha256sums.txt

      - name: "🚀 自动发布到 GitHub Releases"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-Uboot-Fixed
          name: SL3000 (eMMC) 25.12 固件 - U-Boot 物理对齐版
          body: |
            ### 📝 固件说明
            - **U-Boot 格式**: 已注入 uImage Header (factory.bin)
            - **物理布局**: 128MB 内核偏移对齐 (136MB 总大小)
            - **身份识别**: 物理锁定为 `sl,3000-emmc`
          files: |
            openwrt/bin/targets/mediatek/filogic/SL3000-Final-sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/SL3000-Uboot-factory.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
