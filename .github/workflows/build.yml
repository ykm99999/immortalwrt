name: SL3000-Factory-Ultimate-Fixed

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 检出仓库
      uses: actions/checkout@v4

    - name: 2. 极致磁盘清理 (针对 Mediatek 编译链优化)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        swap-storage: true

    - name: 3. 环境准备
      run: |
        sudo -E apt-get update
        sudo -E apt-get install -y $(curl -fsSL https://is.gd/depends_static_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: 4. 克隆 ImmortalWrt 源码
      run: git clone -b $REPO_BRANCH --single-branch $REPO_URL openwrt

    - name: 5. 【自愈核心】赋权并执行注入脚本
      run: |
        chmod +x scripts/clean-feeds.sh
        ./scripts/clean-feeds.sh

    - name: 6. 缓存管理
      uses: actions/cache@v3
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-sl3000-${{ env.REPO_BRANCH }}-${{ hashFiles('**/feeds.conf.default') }}

    - name: 7. 软件包预下载
      run: |
        cd openwrt
        make download -j16
        find dl -size -1024c -exec rm -f {} \;

    - name: 8. 执行编译 (全链路监控)
      id: compile
      run: |
        cd openwrt
        # 针对 1GB RAM 设备，通常涉及较多插件，使用全核编译
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 9. 固件收集与自动发布
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: SL3000-v${{ github.run_number }}
        files: |
          openwrt/bin/targets/mediatek/filogic/*factory.bin
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb
          openwrt/bin/targets/mediatek/filogic/*.sha256sum
        body: |
          ### SL3000 Pro (AX3000) 工厂级固件
          - **CPU**: MT7981B
          - **RAM**: 1GB 
          - **Flash**: 128GB eMMC
          - **内核**: 6.12 (ImmortalWrt 25.12)
          - **修复**: 解决了 DTS 编译路径找不到的问题
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
