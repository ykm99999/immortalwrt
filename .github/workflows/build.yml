name: "Build OpenWrt master SL3000 eMMC (WiFi Ready, /mnt Build)"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build-sl3000-master:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout local repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: "Optimize system disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get remove -y --purge azure-cli google-cloud-sdk dotnet powershell mono mysql-server php android snapd || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /usr/share/doc /usr/share/man
          df -h

      - name: "Prepare /mnt"
        run: |
          sudo chown -R runner:runner /mnt
          sudo chmod -R 755 /mnt
          mkdir -p /mnt/openwrt
          df -h

      - name: "Install build dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git-core libncurses5-dev \
            zlib1g-dev gawk flex gettext wget unzip python3 python3-distutils \
            file libssl-dev rsync ccache device-tree-compiler subversion libelf-dev \
            bc bison patch gcc-multilib g++-multilib swig libudev-dev libusb-1.0-0-dev

      - name: "Clone OpenWrt master to /mnt"
        run: |
          rm -rf /mnt/openwrt || true
          git clone --depth=1 https://github.com/openwrt/openwrt.git /mnt/openwrt

      - name: "Cache downloads & ccache"
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: ${{ runner.os }}-sl3000-master
          restore-keys: |
            ${{ runner.os }}-sl3000-master

      - name: "Update & install feeds"
        working-directory: /mnt/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "Base defconfig"
        working-directory: /mnt/openwrt
        run: |
          make defconfig

      - name: "Copy SL3000 three-piece set (DTS/MK/CONFIG, auto files-*)"
        run: |
          OWRT=/mnt/openwrt
          REPO=repo

          # 目标 OpenWrt 的 files-* 目录（master 下）
          OWRT_KVER_DIR="$(cd "$OWRT/target/linux/mediatek" && ls -d files-* 2>/dev/null | sort | tail -n1)"
          if [ -z "$OWRT_KVER_DIR" ]; then
            echo "[FATAL] no files-* under target/linux/mediatek in /mnt/openwrt"
            exit 1
          fi
          echo "[INFO] OpenWrt files dir: $OWRT_KVER_DIR"

          # 仓库里的 files-* 目录（你用脚本生成三件套的地方）
          REPO_KVER_DIR="$(cd "$REPO/target/linux/mediatek" && ls -d files-* 2>/dev/null | sort | tail -n1)"
          if [ -z "$REPO_KVER_DIR" ]; then
            echo "[FATAL] no files-* under repo/target/linux/mediatek"
            exit 1
          fi
          echo "[INFO] Repo files dir: $REPO_KVER_DIR"

          # DTS
          mkdir -p "$OWRT/target/linux/mediatek/$OWRT_KVER_DIR/arch/arm64/boot/dts/mediatek"
          cp "$REPO/target/linux/mediatek/$REPO_KVER_DIR/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts" \
             "$OWRT/target/linux/mediatek/$OWRT_KVER_DIR/arch/arm64/boot/dts/mediatek/"

          # image mk（直接覆盖，保持你仓库里的版本）
          cp "$REPO/target/linux/mediatek/image/filogic.mk" \
             "$OWRT/target/linux/mediatek/image/filogic.mk"

          # .config
          cp "$REPO/.config" "$OWRT/.config"

      - name: "Finalize defconfig & verify SL3000"
        working-directory: /mnt/openwrt
        run: |
          make defconfig
          echo '===== FINAL CONFIG (grep SL3000 / mt79*) ====='
          grep -n SL3000 .config || true
          grep -n 'MT79' .config || true

      - name: "Self-Heal: tools & toolchain"
        working-directory: /mnt/openwrt
        run: |
          if ! ls staging_dir/toolchain-*/bin/*gcc >/dev/null 2>&1; then
            echo '[SELF-HEAL] Toolchain missing → rebuilding'
            make tools/install -j"$(nproc)" V=s
            make toolchain/install -j"$(nproc)" V=s
          else
            echo '[OK] Toolchain already exists'
          fi

      - name: "Self-Heal: kernel prepare"
        working-directory: /mnt/openwrt
        run: |
          if ! find build_dir/target-*/linux-*/linux-*/include/config -name auto.conf >/dev/null 2>&1; then
            echo '[SELF-HEAL] Kernel prepare missing → running prepare'
            make target/linux/prepare V=s
          else
            echo '[OK] Kernel prepare already done'
          fi

      - name: "Self-Heal: kernel compile"
        working-directory: /mnt/openwrt
        run: |
          make target/linux/compile V=s || {
            echo '[SELF-HEAL] Kernel compile failed → retrying once'
            make target/linux/compile V=s
          }

      - name: "Self-Heal: mt76 backport autoconf shim"
        working-directory: /mnt/openwrt
        run: |
          # 某些 mt76 版本仍然在找 mac80211-backport/backport/autoconf.h，这里一次性补一个最小 stub
          for d in staging_dir/target-*/usr/include/mac80211-backport/backport; do
            mkdir -p "$d"
            if [ ! -f "$d/autoconf.h" ]; then
              echo "[SELF-HEAL] creating $d/autoconf.h shim"
              {
                echo "/* mt76/mac80211 backport autoconf shim */"
                echo "#ifndef __BACKPORT_AUTOCONF_H"
                echo "#define __BACKPORT_AUTOCONF_H"
                echo "#endif /* __BACKPORT_AUTOCONF_H */"
              } > "$d/autoconf.h"
            else
              echo "[OK] $d/autoconf.h already exists"
            fi
          done

      - name: "Self-Heal: WiFi stack (mac80211 + mt76 on master)"
        working-directory: /mnt/openwrt
        run: |
          echo '[INFO] Building mac80211 + mt76 from master'
          make package/kernel/mac80211/compile V=s
          make package/kernel/mt76/compile V=s

      - name: "Build SL3000 eMMC firmware (master, with WiFi)"
        working-directory: /mnt/openwrt
        env:
          SKIP_TARGET_CHECK: "1"
          FORCE: "1"
        run: |
          make download -j8 || echo '[WARN] download failed (non-fatal)'

          for i in 1 2; do
            make -j"$(nproc)" V=s 2>&1 | tee firmware-build.log && break
            echo "[SELF-HEAL] Build failed (attempt $i) → retrying"
          done

          test -f firmware-build.log || echo '[ERROR] firmware-build.log missing' > firmware-build.log

      - name: "Upload build logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-master-build-logs
          path: /mnt/openwrt/firmware-build.log
          retention-days: 7

      - name: "Upload firmware artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-master-sl3000-emmc-firmware
          path: /mnt/openwrt/bin/targets/mediatek/filogic/
          retention-days: 30

      - name: "Auto Release firmware (master snapshot)"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tagname: sl3000-emmc-openwrt-master-${{ github.run_number }}-${{ github.run_id }}
          name: SL3000 EMMC OpenWrt master #${{ github.run_number }}
          body: |
            OpenWrt master / snapshot
            Target: SL3000 (MT7981B eMMC, MT7991/MT7996 WiFi)
            WiFi: mt76 connac3 from master
            Auto three-piece (DTS/MK/CONFIG)
            Self-Healing Build System
          files: /mnt/openwrt/bin/targets/mediatek/filogic/*
          prerelease: true
