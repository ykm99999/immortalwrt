name: SL3000-100%-SUCCESS-SLIM
on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
  TERM: xterm
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 清理磁盘空间（大幅提高成功率！）
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /opt/google /opt/microsoft
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-dev rsync unzip git wget curl device-tree-compiler libelf-dev

      - name: Clean & clone source
        run: |
          rm -rf "${{ env.WORKDIR }}"
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git "${{ env.WORKDIR }}"

      # 只缓存 dl，最稳、最省空间
      - name: Cache dl packages
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKDIR }}/dl
          key: dl-${{ runner.os }}
          restore-keys: dl-${{ runner.os }}

      - name: Inject DTS & config
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eo pipefail
          mkdir -p target/linux/mediatek/dts
          cp -f ../mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/
          chmod +x ../sl3000-patch.sh
          ../sl3000-patch.sh

      # 单线程 = 100% 不炸
      - name: Build tools & toolchain
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/compile -j1 V=s
          make tools/install -j1 V=s
          make toolchain/compile -j1 V=s
          make toolchain/install -j1 V=s

      # 编译完自动清理中间文件，省空间
      - name: Build firmware & clean
        working-directory: ${{ env.WORKDIR }}
        run: |
          make -j1 V=s
          rm -rf build_dir target/linux/*/linux-*

      # 找固件
      - name: Find firmware
        working-directory: ${{ env.WORKDIR }}
        run: |
          BIN=$(find bin/targets -name "*sl3000*sysupgrade*.bin" -o -name "*sl3000*factory*.bin" | head -1)
          echo "path=$BIN" >> $GITHUB_ENV

      # 上传
      - name: Upload firmware
        uses: softprops/softprops-release@v2
        if: success()
        with:
          tag_name: SL3000-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/${{ env.path }}
