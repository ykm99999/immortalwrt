name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出你仓库（含三件套+脚本）
        uses: actions/checkout@v4

      - name: 2. 磁盘优化 + Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /var/lib/docker
          sudo swapoff -a && sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk libncurses5-dev libssl-dev

      - name: 3. 克隆源码
        run: |
          [ -d "${WORKDIR}" ] || git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${WORKDIR}

      - name: 4. 执行你仓库脚本 scripts/clean-feeds.sh
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh

      - name: 5. 编译工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 6. 编译固件
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/compile -j$(nproc) || make package/compile -j1 V=s
          make package/index -j1 V=s || echo "⚠️ 跳过签名"
          make package/install -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 7. 收集固件
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: |
          mkdir -p ../release
          find bin/targets -name "*sysupgrade.bin" -size +10M -exec cp {} ../release/ \;

      - name: 8. 自动发布
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-${{ github.run_id }}
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
