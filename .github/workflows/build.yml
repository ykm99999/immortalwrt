name: SL3000_Final_Golden_Build

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "📂 步骤3：源码克隆"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 步骤4：物理外科修复 (ATF 路径锁定版)"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 步骤5：工具链构建"
        working-directory: ./openwrt
        run: |
          make defconfig
          make tools/install -j2 V=s || make tools/install -j1 V=s
          make toolchain/install -j2 V=s || make toolchain/install -j1 V=s

      - name: "🔨 步骤6：引导系统精准编译"
        working-directory: ./openwrt
        run: |
          # 1. 编译你确认的 ATF 物理路径
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          
          # 2. 编译经过物理修复的 U-Boot
          make package/boot/uboot-mediatek/compile V=s -j1
          
          # 3. 全量总攻
          make -j$(nproc) V=s || make -j1 V=s

      - name: "📦 步骤7：产物物理收割"
        run: |
          mkdir -p "dist"
          # 收集系统固件
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*3000-emmc*sysupgrade.bin" -exec cp -v {} dist/SL3000-Firmware.bin \;
          # 收集引导二进制 (包含关键的 bl2.img 和 u-boot-sl3000.bin)
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*.img" -exec cp -v {} dist/ \; || true
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*u-boot-sl3000.bin" -exec cp -v {} dist/ \; || true

      - name: "🚀 步骤8：旗舰发布"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Standard-${{ github.run_number }}
          files: dist/*
          body: |
            SL3000 (MT7981) 物理对齐版构建成功
            - ATF 路径锁定：arm-trusted-firmware-mediatek
            - ATF 目标锁定：mt7981-emmc-ddr3
            - U-Boot：2024.10 原生 eMMC 模板修复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
