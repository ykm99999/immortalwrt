name: Build-SL3000-25.12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

    - name: Clone OpenWrt 25.12
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        git checkout 25.12

    - name: Update & Install Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Run clean-feeds.sh (SL3000 25.12)
      working-directory: openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh
        bash $GITHUB_WORKSPACE/repo/scripts/clean-feeds.sh

    - name: Defconfig
      working-directory: openwrt
      run: make defconfig

    - name: Download Sources
      working-directory: openwrt
      run: make download -j8

    - name: Build Firmware
      working-directory: openwrt
      run: make -j$(nproc)

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-25.12
        path: openwrt/bin/targets
