name: SL3000-V13.5-Full-System

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 磁盘自愈 (延续 12G Swap 策略)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          # 🎯 唯一物理修复：先关闭 swap 解决 Text file busy，确保 fallocate 成功
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 3. 安装依赖 (原文还原，拒绝任何多余包)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev

      - name: 4. 克隆源码体系
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 5. 开启缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-openwrt-v13.5

      - name: 6. 运行补丁脚本 (延续三件套注入)
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: 7. 编译工具链 (原文还原)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 8. 内核 DTS 强力注入 (原文还原)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv ../custom-config/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
          sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
          echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"

      - name: 9. 执行全量打包编译 (⚠️ 仅修复 PATH 路径，绝无其他修改)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 核心修复：手动将编译生成的工具路径加入 PATH，确保能找到 fwtool
          export PATH=$(pwd)/staging_dir/host/bin:$PATH
          mkdir -p build_dir/target-aarch64_cortex-a53_musl/root-mediatek
          
          # 延续 compile 和 install 指令
          make target/linux/compile -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 10. 发布工程产物
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
