name: Build_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境清理"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 环境补全"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆专属路由器源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 执行物理补丁"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 构建工具链"
        working-directory: ./openwrt
        run: |
          make defconfig
          printf '\n' | make oldconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      - name: "🔨 构建核心固件 (物理优先策略)"
        working-directory: ./openwrt
        run: |
          make defconfig
          printf '\n' | make oldconfig
          # 物理修复：在杂包开始前，强制先行编译引导程序，确保 FIP 依赖链条完整
          make package/boot/uboot-mediatek/compile -j$(nproc) V=s || true
          make package/boot/atf-mediatek/compile -j$(nproc) V=s || true
          make -j$(nproc) || make -j1 V=s

      - name: "📦 固件归集 (全盘物理收割)"
        run: |
          mkdir -p "collect_firmware"
          
          # 1. 物理归集镜像
          OUTPUT_DIR="openwrt/bin/targets/mediatek/filogic"
          if [ -d "$OUTPUT_DIR" ]; then
              cp -v "$OUTPUT_DIR"/*3000-emmc*sysupgrade.bin collect_firmware/SL3000-Final-sysupgrade.bin || true
              cp -v "$OUTPUT_DIR"/*3000-emmc*factory.bin collect_firmware/SL3000-Uboot-factory.bin || true
              cp -v "$OUTPUT_DIR"/*.fip collect_firmware/SL3000-Uboot-FIP.bin || true
          fi
          
          # 2. 🔥 暴力收割：全路径扫描 bin 目录，物理捕获所有 fip/u-boot/bl31 产物
          sudo find openwrt/bin/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl31*" -o -name "*atf*" \) -exec cp -v {} collect_firmware/ \; || true
          
          # 3. 配置文件备份
          cp -v openwrt/.config collect_firmware/3000-emmc.config || true
          cd collect_firmware && sha256sum *.bin *.config > sha256sums.txt || true

      - name: "🚀 自动发布"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-V${{ github.run_number }}
          files: |
            collect_firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
