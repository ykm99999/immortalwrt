name: SL3000-2512-Factory-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境 (12G Swap + 依赖)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler libncurses5-dev libssl-dev

      - name: 3. 克隆源码 (🎯 目标 25.12)
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 开启状态缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-sl3000-2512-ultra

      - name: 5. 运行补丁脚本 (🎯 执行 scripts/clean-feeds.sh)
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: 6. 编译工具链 (🎯 25.12 必须重编工具)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make tools/firmware-utils/compile V=s
          make toolchain/install -j$(nproc)

      - name: 7. DTS 根目录物理注入与 6.12 路径修复
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          # 🎯 物理对齐：从根目录 (../) 读取 DTS 文件
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r K_DTS_DIR; do
            echo "📥 正在从根目录注入并修复: $K_DTS_DIR"
            cp -fv ../mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            
            # 🎯 核心修复：解决 25.12 报错 fatal error: mediatek/mt7981.dtsi
            sed -i 's|mediatek/mt7981.dtsi|mt7981.dtsi|g' "$K_DTS_DIR/mt7981b-sl3000-emmc.dts"
            
            # 注册 Makefile
            sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          done

      - name: 8. 极限封包编译 (🎯 延续 24.10 成功劫持逻辑)
        working-directory: ${{ env.WORKDIR }}
        run: |
          HOST_BIN="$(pwd)/staging_dir/host/bin"
          mkdir -p "$HOST_BIN"
          
          # 延续 24.10 成功方案：物理拷贝 opkg
          [ ! -f "$HOST_BIN/opkg" ] && cp -fv "$(which opkg)" "$HOST_BIN/opkg" || true
          [ ! -f "$HOST_BIN/mkhash" ] && cp -fv "$(which mkhash)" "$HOST_BIN/mkhash" || true
          
          # 25.12 额外建立 fwtool 全局硬链接
          FW_REAL=$(find staging_dir/host/bin/ -name "fwtool" | head -n 1)
          [ -n "$FW_REAL" ] && sudo ln -sf "$(pwd)/$FW_REAL" /usr/bin/fwtool || true
          
          export PATH="$HOST_BIN:$PATH"
          
          # 执行编译
          make target/linux/compile -j$(nproc) V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 9. 发布产物 (🎯 包含 128MB 校验)
        working-directory: ${{ env.WORKDIR }}
        run: |
          FIRMWARE=$(find bin/targets/mediatek/filogic/ -name "*sysupgrade.bin" | head -n 1)
          if [ -z "$FIRMWARE" ]; then echo "❌ 固件生成失败！" && exit 1; fi
          SIZE=$(stat -c%s "$FIRMWARE")
          echo "📏 产物大小: $SIZE 字节"
          [ $SIZE -ge 134217728 ] && echo "✅ 规格对齐成功" || echo "⚠️ 规格未达 128MB"

      - name: 10. 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-2512-Root-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
