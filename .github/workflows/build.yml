name: SL3000-Ultimate-Factory-Build

on:
  workflow_dispatch: # 手动触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 检出本地配置
      uses: actions/checkout@v4

    - name: 2. 磁盘最大化清理 (释放 35GB+)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        swap-storage: true

    - name: 3. 部署编译依赖
      run: |
        sudo -E apt-get update
        sudo -E apt-get install -y $(curl -fsSL https://is.gd/depends_static_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: 4. 克隆 ImmortalWrt 源码
      run: git clone -b $REPO_BRANCH --single-branch $REPO_URL openwrt

    - name: 5. 执行权限修复与自愈注入
      run: |
        chmod +x scripts/clean-feeds.sh
        ./scripts/clean-feeds.sh

    - name: 6. 缓存机制
      uses: actions/cache@v3
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-sl3000-${{ env.REPO_BRANCH }}

    - name: 7. 预下载软件包
      run: |
        cd openwrt
        make download -j16
        find dl -size -1024c -exec rm -f {} \;

    - name: 8. 执行全核编译
      id: compile
      run: |
        cd openwrt
        # 全核编译，报错则自动单线程输出日志
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 9. 发布至 Release
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: SL3000-PRO-v${{ github.run_number }}
        files: |
          openwrt/bin/targets/mediatek/filogic/*factory.bin
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb
          openwrt/bin/targets/mediatek/filogic/*.sha256sum
        body: |
          ### SL3000 AX3000 旗舰版固件
          - **硬件规格**: MT7981B + 1GB RAM + 128GB eMMC
          - **内核版本**: 6.12
          - **特性**: 已修正 DTS Include 路径，开启 GPT 分区支持。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
