name: SL3000-Ultimate-Factory-V4

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出旗舰仓库
        uses: actions/checkout@v4

      - name: 2. 动态 Swap 与极速环境清理
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo fallocate -l 10G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 3. 部署 25.12 源码架构
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev ccache
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 执行旗舰级专属注入
        run: |
          chmod +x scripts/clean-feeds.sh
          ./scripts/clean-feeds.sh 2>&1 | tee build.log

      - name: 5. 编译基础工具链 (Flagship Parallel)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 6. [旗舰锁死] 内核源码二次加固
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          # 注入经过缝合的物理 DTS
          cp -fv custom_files/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
          # 强制 Makefile 注册
          sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK)/a \dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$K_DTS_DIR/Makefile"

      - name: 7. 旗舰极速全量编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make target/linux/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make package/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make target/install -j$(nproc) 2>&1 | tee -a ../build.log
          # 生成指纹校验
          cd bin/targets/mediatek/filogic/
          sha256sum *.bin > sha256sums

      - name: 8. 发布旗舰工厂固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-25.12-FLAGSHIP-${{ github.run_id }}
          body: |
            ## SL3000 Factory Flagship Edition
            - **Branch**: ImmortalWrt 25.12
            - **Memory**: 1GB (Physically Patched)
            - **Storage**: 1024MB Partition Scheme
            - **Optimization**: O3 Speed Injection
          files: |
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/sha256sums
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 故障深度诊断 (Flagship Logger)
        if: failure()
        run: |
          echo "==================== 🚨 FLAGSHIP ERROR ANALYSIS 🚨 ===================="
          [ -f build.log ] && tail -n 100 build.log || ls -R
          echo "======================================================================="
