name: Build ImmortalWrt 25.12 (SL3000 eMMC Flagship)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出仓库（包含 sl3000-tools）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 优化磁盘空间
      - name: Optimize disk space
        run: |
          sudo apt-get remove -y --purge azure-cli google-cloud-sdk dotnet powershell mono mysql php android* || true
          sudo apt-get autoremove -y
          sudo apt-get clean

      # 3. 安装构建依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git-core libncurses5-dev \
            zlib1g-dev gawk flex gettext wget unzip python3 python3-distutils \
            file libssl-dev rsync ccache device-tree-compiler

      # 4. 克隆 ImmortalWrt 25.12 源码
      - name: Clone ImmortalWrt 25.12 source
        run: |
          rm -rf openwrt
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      # 5. 复制 SL3000 工具链
      - name: Copy SL3000 tools
        run: |
          rm -rf openwrt/sl3000-tools
          cp -r sl3000-tools openwrt/

      # 6. 赋予脚本执行权限
      - name: Make scripts executable
        working-directory: openwrt
        run: |
          chmod +x sl3000-tools/generate-three-piece.sh
          chmod +x sl3000-tools/all-in-one.sh

      # ⭐ 7. 更新 feeds（必须在 DTS 检查前）
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a

      # ⭐ 8. 生成默认配置（必须在 toolchain 前）
      - name: Normalize config
        working-directory: openwrt
        run: |
          make defconfig

      # ⭐ 9. 构建工具链（生成 build_dir + kernel include）
      - name: Build toolchain
        working-directory: openwrt
        run: |
          make toolchain/install -j$(nproc) V=s

      # ⭐ 10. 生成三件套（25.12 / 6.12）
      - name: Generate SL3000 Three-Piece Set
        working-directory: openwrt
        run: |
          ./sl3000-tools/generate-three-piece.sh

      # ⭐ 11. 运行三件套检查（此时 build_dir 已存在 → DTS 检查不会报错）
      - name: Run all-in-one CHECK
        working-directory: openwrt
        run: |
          ./sl3000-tools/all-in-one.sh check

      # 12. 使用三件套生成的 .config
      - name: Use generated .config
        working-directory: openwrt
        run: |
          cp .config .config.backup
          echo "✔ 已使用三件套生成的 .config"

      # 13. 构建固件
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s | tee build.log

      # 14. 上传构建日志
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log

      # 15. 上传固件产物
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-sl3000-emmc-25.12
          path: openwrt/bin/targets/mediatek/filogic/

      # 16. 发布固件
      - name: Release firmware
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sl3000-emmc-25.12-${{ github.run_number }}-${{ github.run_id }}
          name: "SL3000 eMMC Firmware Build (25.12) #${{ github.run_number }}"
          body: |
            自动构建的 SL3000 eMMC 固件 (ImmortalWrt 25.12 / Linux 6.12)
            - 三件套按 25.12 黄金模板生成
            - DTS 预处理 + 语法检查通过
            - 工具链构建完成
            - 固件构建完成
          files: |
            openwrt/bin/targets/mediatek/filogic/*
