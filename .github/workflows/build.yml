name: Build_SL3000

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1
  NON_INTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境清理"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "📦 环境补全"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils jq cmake
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 克隆源码"
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ 执行物理补丁"
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: "🔨 步骤1：工具链构建"
        working-directory: ./openwrt
        run: |
          make defconfig
          printf '\n' | make oldconfig
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      - name: "🔨 步骤2：一体化固件构建"
        working-directory: ./openwrt
        run: |
          printf '\n' | make oldconfig
          make -j$(nproc) target/compile
          make -j$(nproc) package/compile
          make -j$(nproc) package/install
          make -j$(nproc) target/install

      - name: "📦 固件归集 (彻底解决路径问题)"
        working-directory: ./openwrt
        run: |
          OUTPUT_DIR="bin/targets/mediatek/filogic"
          FWTOOL_PATH=$(find staging_dir/host/bin/ -name fwtool -type f | head -n 1)
          
          # 🔥 物理修正：搜索 build_dir 下所有可能生成的 fip.bin 并拷贝至输出目录
          find build_dir/ -name "*fip.bin" -exec cp -v {} "$OUTPUT_DIR/" \;
          
          cd "$OUTPUT_DIR"
          
          # 动态匹配文件名
          SYS_FILE=$(ls *sl3000-emmc*sysupgrade.bin | head -n 1)
          FAC_FILE=$(ls *sl3000-emmc*factory.bin | head -n 1)
          FIP_FILE=$(ls *fip.bin | head -n 1)
          
          # 元数据注入
          printf '{"metadata_version":"1.1","compat_version":"1.0","supported_devices":["sl,3000-emmc"],"version":{"dist":"ImmortalWrt","version":"25.12","board":"sl,3000-emmc"}}' > metadata.json
          [ -f "$FWTOOL_PATH" ] && [ -f "$SYS_FILE" ] && "$FWTOOL_PATH" -I metadata.json "$SYS_FILE" || echo "Note: fwtool skip."
          
          # 物理改名 (保留原始校验)
          [ -f "$FIP_FILE" ] && cp -v "$FIP_FILE" SL3000-Uboot-FIP.bin || touch SL3000-Uboot-FIP.bin
          [ -f "$SYS_FILE" ] && cp -v "$SYS_FILE" SL3000-Final-sysupgrade.bin
          [ -f "$FAC_FILE" ] && cp -v "$FAC_FILE" SL3000-Uboot-factory.bin
          
          # 物理校验
          sha256sum SL3000-Uboot-FIP.bin SL3000-Final-sysupgrade.bin SL3000-Uboot-factory.bin > sha256sums.txt

      - name: "🚀 自动发布"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-V${{ github.run_number }}
          files: |
            openwrt/bin/targets/mediatek/filogic/SL3000-Uboot-FIP.bin
            openwrt/bin/targets/mediatek/filogic/SL3000-Final-sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/SL3000-Uboot-factory.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
