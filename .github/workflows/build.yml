name: SL3000-2512-V15-Absolute-Flatten

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. [补丁] 磁盘空间优化与 12G Swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /etc/mysql /etc/php || true
          sudo docker image prune -a -f || true
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-cloud-sdk google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 3. 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools python3-setuptools \
            swig unzip zlib1g-dev rsync wget file libelf-dev device-tree-compiler qemu-utils

      - name: 4. 克隆源码 (25.12)
        run: git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 5. 运行脚本补丁
        run: chmod +x scripts/clean-feeds.sh && ./scripts/clean-feeds.sh

      - name: 6. [拆分 A] 构建工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 7. [物理熔断] DTS 彻底自洽化 (百分百一次性解决)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 物理源路径定位
          SRC_DTS_PATH="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek"
          INCLUDE_PATH="target/linux/mediatek/files-6.12/include"
          
          echo "==== [CPP 物理展开：生成单体 DTS] ===="
          # 🎯 核心黑科技：强制预处理器展开所有 include 到一个临时文件中
          # -P 消除行号干扰, -nostdinc 保证纯净, -I 指定物理搜索路径
          cpp -I "$SRC_DTS_PATH" -I "$INCLUDE_PATH" -nostdinc -undef -x assembler-with-cpp -P ../mt7981b-sl3000-emmc.dts ./sl3000_physical_melted.dts
          
          echo "==== [物理全路径强制同步] ===="
          make target/linux/prepare -j$(nproc)
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r DTS_DIR; do
            # 🎯 将生成的单体文件分发，从此不依赖任何 .dtsi 外部文件
            cp -fv ./sl3000_physical_melted.dts "$DTS_DIR/mt7981b-sl3000-emmc.dts"
            cp -fv ./sl3000_physical_melted.dts "$DTS_DIR/mt7981-rfb.dts"
            
            if [ -f "$DTS_DIR/Makefile" ]; then
              sed -i '/mt7981b-sl3000-emmc.dtb/d' "$DTS_DIR/Makefile"
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$DTS_DIR/Makefile"
            fi
          done

      - name: 8. [拆分 B] 构建固件
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 🎯 [物理劫持补丁] mkhash 修复
          HOST_BIN="$(pwd)/staging_dir/host/bin"
          [ -f "$HOST_BIN/mkhash" ] && sudo ln -sf "$HOST_BIN/mkhash" /usr/bin/mkhash || true
          
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 9. 导出结果
        working-directory: ${{ env.WORKDIR }}
        run: |
          FIRMWARE=$(find bin/targets/ -name "*sl3000*.bin" | head -n 1)
          [ -n "$FIRMWARE" ] && echo "FIRMWARE_PATH=$FIRMWARE" >> $GITHUB_ENV || exit 1

      - name: 10. 发布 Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Melted-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/${{ env.FIRMWARE_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
