name: SL3000-Auto-Release-V30

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af --volumes

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk m4 libtool-bin rsync \
          unzip wget curl patch git-core gettext libncurses-dev zlib1g-dev libssl-dev \
          libelf-dev python3 python3-pip ccache device-tree-compiler bc dos2unix

      - name: 3. Clone Sources
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone https://github.com/${{ github.repository }}.git custom-repo

      - name: 4. Execute Auto-Merge (V30.0)
        working-directory: ${{ github.workspace }}/immortalwrt
        env:
          CUSTOM_ASSETS: ${{ github.workspace }}/custom-repo
        run: |
          cp ${{ env.CUSTOM_ASSETS }}/scripts/clean-feeds.sh ./
          chmod +x clean-feeds.sh
          ./clean-feeds.sh

      - name: 5. Kernel Hook & Rootfs Link
        working-directory: ${{ github.workspace }}/immortalwrt
        run: |
          make target/linux/prepare -j$(nproc)
          REAL_K_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$REAL_K_DIR" ]; then
            TEMP_DTS=$(find target/linux/mediatek/files-* -name "mt7981b-sl3000-emmc.dts" | head -n 1)
            cp -v "$TEMP_DTS" "$REAL_K_DIR/"
            sed -i '/mt7981-rfb.dtb/a dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$REAL_K_DIR/Makefile"
          fi
          
          # 【核心修复】建立 rootfs 路径兼容性链接
          cd build_dir/target-aarch64_cortex-a53_musl
          [ ! -d "root-mediatek" ] && ln -sf root-mediatek_filogic root-mediatek
          echo "✅ Rootfs path link created."

      - name: 6. Build
        working-directory: ${{ github.workspace }}/immortalwrt
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make -j$(nproc) || make -j1 V=s

      - name: 7. Release Assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-V30-${{ github.run_number }}
          files: ${{ github.workspace }}/immortalwrt/bin/targets/mediatek/filogic/*.bin
