name: Build SL3000 ImmortalWrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 最大化磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /var/lib/docker
          sudo swapoff -a
          sudo rm -f /swapfile
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bzip2 gawk gcc-multilib libelf-dev libncurses-dev libssl-dev python3 unzip git

      - name: 克隆源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 物理注入三件套到源码底层
        run: |
          cd openwrt
          DTS_DEST="target/linux/mediatek/files/arch/arm64/boot/dts/mediatek"
          mkdir -p "$DTS_DEST"
          cp -f ../mt7981b-sl3000-emmc.dts "$DTS_DEST"/
          cp -f ../filogic.mk target/linux/mediatek/
          cp -f ../sl3000.config .config
          make defconfig

      - name: 执行 clean-feeds.sh
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/clean-feeds.sh"
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/clean-feeds.sh"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: 安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 自动查找固件
        id: find_firmware
        run: |
          cd openwrt
          BIN=$(find bin/targets -type f -name "*sysupgrade*.bin" | head -n 1)
          echo "FIRM_PATH=$BIN" >> $GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_id }}
          name: SL3000 自动编译
          files: openwrt/${{ env.FIRM_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
